<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Whisper</title>
<style>
/* Whisper 网页传输。颜色、字号、圆角、阴影和弹簧都来自 DESIGN.md，不在这里另起一套。
   布局：窄屏是页面栈的手机密度，宽屏把对话收成居中的一列；连接前的几步是画布上居中的一叠。 */
:root {
  color-scheme: light;
  --canvas: #F9F9FB; --content: #FFFFFF; --group: #FFFFFF; --raised: #FFFFFF; --bubble: #F0F0F3;
  --ink: #1C2024; --ink2: #60646C; --ink3: #80838D; --ink2-glass: rgba(0,7,20,.624);
  --accent: #0090FF; --accent-text: #0D74CE; --on-accent: #FFFFFF;
  --tint: #E6F4FE; --tint-hover: #D5EFFF; --tint-active: #C2E5FF; --on-tint: #113264;
  --ok: #218358; --warn: #AB6400; --bad: #CE2C31;
  --sep: rgba(0,0,47,.149); --border: rgba(0,6,46,.196);
  --fill: rgba(0,0,51,.059); --fill2: rgba(0,0,45,.09); --selected: rgba(0,9,50,.122);
  --glass-control: rgba(255,255,255,.7); --glass-panel: rgba(249,249,251,.74);
  --highlight: inset 0 .5px 0 rgba(255,255,255,.8);
  --e1: 0 1px 3px rgba(0,0,0,.05);
  --e2: 0 8px 28px rgba(0,0,0,.15), 0 1px 4px rgba(0,0,0,.1), 0 0 0 .5px rgba(0,0,0,.1);
  --e3: 0 32px 80px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.15), 0 0 0 .5px rgba(0,0,0,.2);
  --scrim: rgba(0,0,0,.3);
  --device-on: #03A9F4; --device-off: #E0E0E0; --device-off-mark: #9E9E9E;
  --paper: #FFFFFF; --paper-fold: #E8E8EC; --paper-edge: rgba(0,0,0,.14);
  --focus: rgba(0,144,255,.45);
  --viewer: #000000; --on-viewer: #FFFFFF;

  --large: 26px; --title: 20px; --head: 15px; --body: 14px; --note: 12px; --tiny: 11px;
  --r-xs: 6px; --r-s: 10px; --r-m: 14px; --r-l: 20px; --r-bubble: 18px; --r-composer: 26px;
  --target: 28px; --action: 28px; --avatar: 32px; --field: 36px;

  --snappy: linear(0, 0.0148, 0.0531, 0.1073, 0.1714, 0.2409, 0.3124, 0.3832, 0.4515, 0.5162, 0.5764, 0.6318, 0.682, 0.7271, 0.7673, 0.8029, 0.834, 0.8611, 0.8846, 0.9047, 0.9219, 0.9365, 0.9489, 0.9592, 0.9677, 0.9748, 0.9807, 0.9854, 0.9892, 0.9923, 0.9947, 0.9966, 1);
  --snappy-dur: 260ms;
  --smooth: linear(0, 0.0271, 0.0939, 0.1832, 0.2826, 0.3835, 0.4803, 0.5696, 0.6494, 0.719, 0.7785, 0.8284, 0.8696, 0.9029, 0.9295, 0.9504, 0.9665, 0.9786, 0.9876, 0.9941, 0.9986, 1.0016, 1.0035, 1.0045, 1.005, 1.005, 1.0048, 1.0044, 1.0039, 1.0034, 1.0029, 1.0024, 1);
  --smooth-dur: 540ms;
  --expressive: linear(0, 0.0245, 0.0873, 0.1745, 0.275, 0.3804, 0.4844, 0.5825, 0.6719, 0.7509, 0.8189, 0.8757, 0.9221, 0.9588, 0.9869, 1.0075, 1.0219, 1.0312, 1.0363, 1.0383, 1.0379, 1.0359, 1.0328, 1.0291, 1.0251, 1.021, 1.0172, 1.0136, 1.0105, 1.0077, 1.0054, 1.0035, 1);
  --expressive-dur: 600ms;

  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", "Noto Sans SC", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;
}
@media (pointer: coarse) {
  :root { --large: 32px; --title: 22px; --head: 17px; --body: 16px; --note: 14px; --tiny: 12px;
          --target: 48px; --action: 38px; --avatar: 40px; --field: 40px; }
}
/* 大屏（2K、4K 显示器按 100% 缩放时）：字和栏都大一档，一列也宽一点 */
@media (pointer: fine) and (min-width: 1680px) {
  :root { --large: 28px; --title: 22px; --head: 16px; --body: 15px; --note: 13px; --tiny: 12px;
          --target: 30px; --action: 30px; --avatar: 34px; --field: 38px; --column: 980px; --dock-w: 760px; }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --canvas: #111113; --content: #18191B; --group: #18191B; --raised: #272A2D; --bubble: #272A2D;
    --ink: #EDEEF0; --ink2: #B0B4BA; --ink3: #777B84; --ink2-glass: rgba(241,247,254,.71);
    --accent-text: #70B8FF; --tint: #0D2847; --tint-hover: #003362; --tint-active: #004074; --on-tint: #C2E6FF;
    --ok: #3DD68C; --warn: #FFCA16; --bad: #FF9592;
    --sep: rgba(214,235,253,.188); --border: rgba(217,237,255,.251);
    --fill: rgba(221,234,248,.078); --fill2: rgba(211,237,248,.114); --selected: rgba(217,237,254,.145);
    --glass-control: rgba(46,49,53,.68); --glass-panel: rgba(33,34,37,.72);
    --highlight: inset 0 .5px 0 rgba(255,255,255,.15);
    --e1: 0 1px 2px rgba(0,0,0,.3), 0 0 0 .5px rgba(255,255,255,.05);
    --e2: 0 8px 28px rgba(0,0,0,.5), 0 1px 4px rgba(0,0,0,.4), 0 0 0 .5px rgba(255,255,255,.1);
    --e3: 0 32px 80px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.4), 0 0 0 .5px rgba(255,255,255,.15);
    --scrim: rgba(0,0,0,.5);
    --device-off: #616161; --device-off-mark: #BDBDBD;
    --paper: #EFEFF3; --paper-fold: #D3D3DA; --paper-edge: rgba(0,0,0,.4);
    --focus: rgba(112,184,255,.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #111113; --content: #18191B; --group: #18191B; --raised: #272A2D; --bubble: #272A2D;
  --ink: #EDEEF0; --ink2: #B0B4BA; --ink3: #777B84; --ink2-glass: rgba(241,247,254,.71);
  --accent-text: #70B8FF; --tint: #0D2847; --tint-hover: #003362; --tint-active: #004074; --on-tint: #C2E6FF;
  --ok: #3DD68C; --warn: #FFCA16; --bad: #FF9592;
  --sep: rgba(214,235,253,.188); --border: rgba(217,237,255,.251);
  --fill: rgba(221,234,248,.078); --fill2: rgba(211,237,248,.114); --selected: rgba(217,237,254,.145);
  --glass-control: rgba(46,49,53,.68); --glass-panel: rgba(33,34,37,.72);
  --highlight: inset 0 .5px 0 rgba(255,255,255,.15);
  --e1: 0 1px 2px rgba(0,0,0,.3), 0 0 0 .5px rgba(255,255,255,.05);
  --e2: 0 8px 28px rgba(0,0,0,.5), 0 1px 4px rgba(0,0,0,.4), 0 0 0 .5px rgba(255,255,255,.1);
  --e3: 0 32px 80px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.4), 0 0 0 .5px rgba(255,255,255,.15);
  --scrim: rgba(0,0,0,.5);
  --device-off: #616161; --device-off-mark: #BDBDBD;
  --paper: #EFEFF3; --paper-fold: #D3D3DA; --paper-edge: rgba(0,0,0,.4);
  --focus: rgba(112,184,255,.55);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: var(--content); color: var(--ink);
  font: 400 var(--body)/1.45 var(--sans);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body.at-gate { background: var(--canvas); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible, .media:focus-visible, .card:focus-visible {
  outline: none; box-shadow: 0 0 0 3px var(--focus);
}
.svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.i { width: 1em; height: 1em; display: block; flex: none; }

/* 按压：缩到 0.97 再弹回 */
.press { transition: transform var(--snappy-dur) var(--snappy), background-color var(--snappy-dur) var(--snappy), opacity var(--snappy-dur) var(--snappy); }
.press:active { transform: scale(.97); }

/* ---------- 按钮：一个组件三档，胶囊形 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 34px; min-width: 72px; padding: 0 18px; border-radius: 999px;
  font-size: var(--body); font-weight: 500; white-space: nowrap;
}
@media (pointer: coarse) { .btn { min-height: 44px; padding: 0 22px; } }
.btn-fill { background: var(--accent); color: var(--on-accent); }
.btn-tint { background: var(--tint); color: var(--on-tint); }
.btn-plain { color: var(--accent-text); }
@media (hover: hover) {
  .btn-fill:hover { filter: brightness(1.06); }
  .btn-tint:hover { background: var(--tint-hover); }
  .btn-plain:hover { background: var(--fill); }
}

/* ---------- 连接前：画布上居中的一叠 ---------- */
.gate {
  min-height: 100vh; min-height: 100dvh;
  display: grid; place-items: center;
  padding-block: calc(32px + env(safe-area-inset-top, 0px)) calc(32px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.gate-stack {
  width: min(100%, 360px);
  display: flex; flex-direction: column; align-items: center; text-align: center;
  animation: rise var(--smooth-dur) var(--smooth) both;
}
.gate-art { height: 112px; display: grid; place-items: end center; margin-bottom: 24px; transition: filter var(--smooth-dur) var(--smooth), opacity var(--smooth-dur) var(--smooth); }
.gate-art svg { display: block; height: 100%; width: auto; filter: drop-shadow(0 10px 18px rgba(0,0,0,.14)); }
.gate-art.off { filter: grayscale(1); opacity: .45; }
/* keep-all: Chinese lines break at spaces and punctuation, not mid-phrase. */
.gate h1, .gate p, .empty p { word-break: keep-all; overflow-wrap: anywhere; }
.gate h1 { margin: 0; font-size: var(--title); line-height: 1.25; font-weight: 600; text-wrap: balance; }
.gate p { margin: 8px 0 0; color: var(--ink2); font-size: var(--note); line-height: 1.5; text-wrap: balance; max-width: 300px; }
.gate .actions { margin-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.code-card {
  margin-top: 20px; width: 100%;
  background: var(--group); border-radius: var(--r-m); box-shadow: var(--e1);
  padding: 18px 16px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.code {
  font: 600 34px/1 var(--mono); letter-spacing: .22em; margin-right: -.22em;
  font-variant-numeric: tabular-nums; color: var(--ink);
}
.waiting { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: var(--note); }
.gate-wait { margin-top: 20px; display: flex; align-items: center; gap: 8px; color: var(--ink3); font-size: var(--note); }

/* 页脚：一行小字，不抢事 */
.made { position: fixed; z-index: 1; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: var(--tiny); color: var(--ink3); }
.made a, .empty-made a { color: inherit; text-decoration: none; padding: 4px 2px; border-radius: 4px; }
@media (hover: hover) { .made a:hover, .empty-made a:hover { color: var(--ink2); text-decoration: underline; text-underline-offset: 2px; } }
.made .dot, .empty-made .dot { margin: 0 6px; opacity: .6; }
@media (max-height: 560px) { .made { position: static; padding: 0 0 calc(14px + env(safe-area-inset-bottom, 0px)); } }

/* iOS 式的转圈 */
.spinner { width: 16px; height: 16px; position: relative; flex: none; }
.spinner i { position: absolute; left: 7.1px; top: 0; width: 1.8px; height: 4.6px; border-radius: 1px; background: currentColor; transform-origin: .9px 8px; animation: tick 0.8s linear infinite; opacity: .2; }
.spinner i:nth-child(1) { transform: rotate(0deg); animation-delay: -.7s; }
.spinner i:nth-child(2) { transform: rotate(45deg); animation-delay: -.6s; }
.spinner i:nth-child(3) { transform: rotate(90deg); animation-delay: -.5s; }
.spinner i:nth-child(4) { transform: rotate(135deg); animation-delay: -.4s; }
.spinner i:nth-child(5) { transform: rotate(180deg); animation-delay: -.3s; }
.spinner i:nth-child(6) { transform: rotate(225deg); animation-delay: -.2s; }
.spinner i:nth-child(7) { transform: rotate(270deg); animation-delay: -.1s; }
.spinner i:nth-child(8) { transform: rotate(315deg); animation-delay: 0s; }
@keyframes tick { 0% { opacity: .85; } 100% { opacity: .2; } }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* ---------- 对话 ---------- */
.chat { min-height: 100vh; min-height: 100dvh; }
/* 顶栏没有实底和分隔线：内容滚到下面时渐隐、变模糊，按钮是浮着的玻璃 */
.bar {
  position: fixed; inset: 0 0 auto; z-index: 20; pointer-events: none;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
}
.bar::before {
  content: ""; position: absolute; inset: 0 0 -18px;
  background: linear-gradient(var(--content) 30%, transparent);
  background: linear-gradient(var(--content) 25%, color-mix(in srgb, var(--content) 72%, transparent) 62%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  -webkit-mask-image: linear-gradient(#000 58%, transparent); mask-image: linear-gradient(#000 58%, transparent);
}
.bar-inner {
  position: relative; max-width: var(--column, 900px); margin: 0 auto; min-height: 56px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
}
.bar-inner > * { pointer-events: auto; }
.who { grid-column: 2; display: flex; align-items: center; gap: 10px; min-width: 0; padding: 10px 0; }
.who-name { font-size: var(--head); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
@media (pointer: coarse) {
  .bar-inner { min-height: 60px; }
  .who { flex-direction: column; gap: 0; padding: 8px 0; }
  .who-name {
    position: relative; margin-top: -5px; padding: 2px 10px; border-radius: 999px;
    font-size: var(--note); font-weight: 600; line-height: 1.35;
    background: var(--glass-control); box-shadow: var(--e1), var(--highlight);
    -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
  }
}
.avatar {
  width: var(--avatar); height: var(--avatar); border-radius: 50%; flex: none;
  display: grid; place-items: center; color: #FFFFFF;
  background: var(--ink3); box-shadow: var(--highlight);
  transition: opacity var(--smooth-dur) var(--smooth), filter var(--smooth-dur) var(--smooth);
}
.avatar svg { width: 58%; height: 58%; }
.avatar.off { opacity: .45; }
.bar-end { grid-column: 3; justify-self: end; display: flex; }
.bar-start { grid-column: 1; justify-self: start; display: flex; }
.bar-icon { width: var(--field); height: var(--field); border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
.bar-icon .i { width: 18px; height: 18px; }
@media (pointer: coarse) { .bar-icon .i { width: 20px; height: 20px; } }
.lang {
  display: inline-flex; align-items: center; gap: 5px; min-height: var(--target); padding: 0 10px;
  border-radius: 999px; color: var(--ink2); font-size: var(--note); font-weight: 500; white-space: nowrap;
}
.lang .i { width: 15px; height: 15px; }
@media (hover: hover) { .lang:hover { background: var(--fill); color: var(--ink); } }
.lang-corner { position: fixed; z-index: 30; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); }
.bar-btn { height: var(--field); padding: 0 16px; border-radius: 999px; color: var(--ink); font-size: var(--body); font-weight: 500; white-space: nowrap; }
@media (hover: hover) { .bar-icon:hover, .bar-btn:hover { background: var(--glass-panel); } }

/* 横过来的手机：高度不够，顶栏回到一行，输入框离底近一点 */
@media (pointer: coarse) and (max-height: 500px) {
  .bar-inner { min-height: 48px; }
  .who { flex-direction: row; gap: 8px; padding: 6px 0; }
  .who-name { margin: 0; padding: 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; font-size: var(--head); }
  :root { --avatar: 30px; }
  .dock { padding-bottom: calc(max(10px, env(safe-area-inset-bottom, 0px)) + var(--kb, 0px)); }
  .gate-art { height: 72px; margin-bottom: 14px; }
  .gate { padding-block: 20px; }
}

.status {
  position: fixed; z-index: 19; left: 50%; top: calc(var(--bar-h, 56px) + 10px);
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px;
  border-radius: 999px; font-size: var(--note); color: var(--ink2-glass); white-space: nowrap;
  background: var(--glass-control); box-shadow: var(--e2), var(--highlight);
  -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
  animation: pop var(--expressive-dur) var(--expressive) both;
}
@keyframes pop { from { opacity: 0; transform: translateX(-50%) scale(.6); } to { opacity: 1; transform: translateX(-50%) scale(1); } }

.list {
  max-width: var(--column, 900px); margin: 0 auto;
  padding: calc(var(--bar-h, 56px) + 8px) max(16px, env(safe-area-inset-right, 0px)) calc(var(--dock-h, 80px) + 24px) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column;
}
@media (pointer: coarse) { .list { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); } }
.stamp { align-self: center; margin: 14px 0 8px; font-size: var(--tiny); color: var(--ink3); font-variant-numeric: tabular-nums; }
.msg { display: flex; flex-direction: column; max-width: min(72%, 30em); margin-top: 16px; }
@media (pointer: coarse) { .msg { max-width: min(80%, 34em); } }
.msg.same { margin-top: 8px; }
.stamp + .msg { margin-top: 0; }
.msg.mine { align-self: flex-end; align-items: flex-end; }
.msg.theirs { align-self: flex-start; align-items: flex-start; }
.msg.enter-mine { animation: from-composer var(--smooth-dur) var(--smooth) both; transform-origin: 100% 100%; }
.msg.enter-theirs { animation: rise var(--smooth-dur) var(--smooth) both; }
@keyframes from-composer { from { opacity: 0; transform: translateY(26px) scale(.9); } to { opacity: 1; transform: none; } }

.bubble {
  padding: 7px 13px; border-radius: var(--r-bubble);
  font-size: var(--body); line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--bubble); color: var(--ink);
  -webkit-user-select: text; user-select: text;
}
.mine .bubble { background: var(--tint-hover); color: var(--on-tint); }
.mine .bubble::selection { background: #8EC8F6; }
.bubble a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; }
.mine .bubble a { color: var(--on-tint); }
.pending .bubble { opacity: .55; transition: opacity var(--smooth-dur) var(--smooth); }
.note-line { margin-top: 4px; display: flex; align-items: center; gap: 4px; font-size: var(--tiny); color: var(--ink2); }
.note-line.warn { color: var(--warn); }
.note-line .i { width: 12px; height: 12px; }
.note-line button { color: var(--accent-text); font-weight: 500; padding: 2px 4px; margin: -2px -4px; border-radius: 6px; }

/* 文件卡 */
.card {
  width: min(276px, 82vw); padding: 10px 12px; border-radius: var(--r-bubble);
  background: var(--bubble); display: flex; align-items: center; gap: 10px; text-align: left;
}
.card-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.card-name { font-size: var(--body); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.card-meta { font-size: var(--note); color: var(--ink2-glass); display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.card-meta.warn { color: var(--ink2-glass); }
.card-meta .warn-word { color: var(--warn); font-weight: 500; }
.card-meta .i { width: 12px; height: 12px; color: var(--warn); }
.paper { position: relative; width: 30px; height: 36px; flex: none; }
.paper svg { width: 100%; height: 100%; display: block; }
.paper .ext { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; font: 700 7.5px/1 var(--sans); letter-spacing: .02em; color: #60646C; text-transform: uppercase; }
.round {
  width: var(--action); height: var(--action); border-radius: 50%; flex: none;

    else { chip.appendChild(paperIcon(file.name)); chip.appendChild(el('span', 'chip-name', file.name)); }
    var x = el('button', 'x'); x.type = 'button'; x.setAttribute('aria-label', t('remove')); x.appendChild(icon('x'));
    x.onclick = function (e) { e.stopPropagation(); app.attachments.splice(app.attachments.indexOf(a), 1); chip.remove(); if (a.url) URL.revokeObjectURL(a.url); $('attachments').hidden = !app.attachments.length; refreshComposer(); };
    chip.appendChild(x);
    $('attachments').appendChild(chip);
    $('attachments').hidden = false;
    refreshComposer();
  }
  function clearAttachments() {
    app.attachments.forEach(function (a) { if (a.url) URL.revokeObjectURL(a.url); });
    app.attachments = [];
    $('attachments').textContent = '';
    $('attachments').hidden = true;
  }

  // ---------- 拖文件进来 ----------
  var dragDepth = 0;
  function dragFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0; }
  window.addEventListener('dragenter', function (e) {
    if (app.phase !== 'chat' || app.ended || !dragFiles(e)) return;
    e.preventDefault();
    if (dragDepth++ === 0) {
      var n = e.dataTransfer.items ? e.dataTransfer.items.length : 0;
      $('drop-art').innerHTML = deviceArt(host.kind, host.os);
      $('drop-title').textContent = t('dropTitle', { name: host.name });
      $('drop-count').textContent = n > 1 ? t('items', { n: n }) : '';
      $('drop-count').hidden = n <= 1;
      $('drop').hidden = false;
    }
  });
  window.addEventListener('dragover', function (e) { if (dragFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = app.phase === 'chat' && !app.ended ? 'copy' : 'none'; } });
  window.addEventListener('dragleave', function () { if (dragDepth > 0 && --dragDepth === 0) $('drop').hidden = true; });
  window.addEventListener('drop', function (e) {
    if (!dragFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    $('drop').hidden = true;
    if (app.phase !== 'chat' || app.ended) return;
    var files = [], folder = false;
    var items = e.dataTransfer.items || [];
    for (var i = 0; i < items.length; i++) {
      var entry = items[i].webkitGetAsEntry && items[i].webkitGetAsEntry();
      if (entry && entry.isDirectory) { folder = true; continue; }
      var f = items[i].getAsFile && items[i].getAsFile();
      if (f) files.push(f);
    }
    if (!items.length) files = Array.prototype.slice.call(e.dataTransfer.files || []);
    if (files.length) sendFiles(files);
    if (folder) toast(t('noFolders'), 2600);
  });
  var toastTimer = 0;
  function toast(text, ms) {
    $('status-text').textContent = text;
    var s = $('status'); s.hidden = false;
    s.querySelector('.spinner').hidden = true;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { s.querySelector('.spinner').hidden = false; renderLink(); }, ms);
  }

  // ---------- 布局 ----------
  function measure() {
    var root = document.documentElement.style;
    root.setProperty('--bar-h', $('bar').offsetHeight + 'px');
    root.setProperty('--dock-h', $('dock').offsetHeight + 'px');
  }
  function nearEnd() { return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 120; }
  var stick = true;
  window.addEventListener('scroll', function () { stick = nearEnd(); }, { passive: true });
  function scrollToEnd(smooth) {
    requestAnimationFrame(function () { window.scrollTo({ top: document.documentElement.scrollHeight, behavior: smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'auto' }); });
  }
  // iOS 上键盘盖住页面时，把输入框抬到键盘上面
  if (window.visualViewport) {
    var vv = window.visualViewport;
    var lift = function () {
      var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb', kb > 60 ? kb + 'px' : '0px');
    };
    vv.addEventListener('resize', lift);
    vv.addEventListener('scroll', lift);
  }
  window.addEventListener('resize', measure);

  // ---------- 语言切换：页面上所有字换一遍，状态和输入框里的字都不动 ----------
  // 官网和 GitHub：页脚一行小字，链接都在新窗口打开
  function renderMade() {
    ['made', 'empty-made'].forEach(function (id) {
      var box = $(id);
      box.textContent = '';
      var site = el('a', null, t('website'));
      site.href = 'https://whisper-lan.github.io/' + (lang === 'zh' ? 'zh' : 'en');
      var code = el('a', null, 'GitHub');
      code.href = 'https://github.com/lawnvi/whisper';
      [site, code].forEach(function (a, i) {
        a.target = '_blank'; a.rel = 'noopener noreferrer';
        if (i) box.appendChild(el('span', 'dot', '·'));
        box.appendChild(a);
      });
    });
  }
  function relabel() {
    renderMade();
    var other = lang === 'zh' ? 'en' : 'zh';
    ['lang-gate', 'lang-chat'].forEach(function (id) {
      var b = $(id), label = b.querySelector('span');
      if (label) label.textContent = t('switchTo');
      b.setAttribute('aria-label', t('switchLabel'));
      b.title = t('switchLabel');
      b.setAttribute('lang', other === 'zh' ? 'zh-CN' : 'en');
    });
    $('end').textContent = t('end');
    $('reconnect').textContent = t('reconnect');
    $('viewer-close').setAttribute('aria-label', t('close'));
    $('viewer-save').setAttribute('aria-label', t('save'));
    $('viewer-hint').textContent = t('holdToSave');
    setHost(host);
    refreshComposer();
    Array.prototype.forEach.call(document.querySelectorAll('.stamp'), function (n) { n.textContent = stampText(+n.dataset.time); });
    app.order.forEach(function (id) { render(app.items[id]); });
    if (app.phase === 'chat') renderLink(); else if (GATE[app.phase]) showGate(app.phase);
  }
  function switchLang() {
    useLang(lang === 'zh' ? 'en' : 'zh');
    store('whisper.web.lang', lang);
    relabel();
  }
  $('lang-gate').onclick = switchLang;
  $('lang-chat').onclick = switchLang;

  // ---------- 按钮 ----------
  $('gate-primary').onclick = connect;
  $('gate-secondary').onclick = function () { transport.send({ t: 'bye' }); transport.stop(); app.link = 'down'; showGate('idle'); };
  $('end').onclick = function () { transport.send({ t: 'bye' }); transport.stop(); app.link = 'down'; endChat('me'); };
  $('reconnect').onclick = function () { app.ended = null; app.joined = false; connect(); };

  relabel();
  connect();
})();
</script>
</body>
</html>
