<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whisper 界面语言</title>
<style>
/* 原型的唯一来源：要改就直接改这个文件，再跑 docs/design/tools 里的检查。
   token 名字和 DESIGN.md 一一对应。入口见 docs/design/README.md。 */
:root{
  --canvas:#f9f9fb; --content:#ffffff; --group:#ffffff; --raised:#ffffff;
  --sidebar:rgba(240,240,243,.66); --mica:rgba(243,243,243,.9); --sidebar-solid:#ffffff; --dev-name:#0f172a; --dev-muted:#64748b; --dev-on:#03a9f4; --dev-near:#4caf50; --dev-off:#e0e0e0; --dev-off-dot:#9e9e9e; --dev-sel:rgba(37,99,235,.08); --control:rgba(255,255,255,.7); --panel:rgba(249,249,251,.74); --scrim:rgba(0,0,0,.3);
  --ink:#1c2024; --ink2:#60646c; --ink3:#80838d;
  --sep:rgba(0,0,47,.149); --fill:rgba(0,0,51,.059); --fill2:rgba(0,0,45,.09); --sel:rgba(0,9,50,.122); --side-sel:rgba(255,255,255,.6); --side-sel-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.05),inset 0 .5px 0 rgba(255,255,255,.8); --bubble:#f0f0f3;
  --ink2-glass:rgba(0,7,20,.624);
  --accent:#0090ff; --accent-text:#0d74ce; --tint:#e6f4fe; --tint-hover:#d5efff; --tint-active:#c2e5ff; --on-tint:#113264; --ok-solid:#30a46c; --warn-solid:#ffc53d; --bad-solid:#e5484d; --border:rgba(0,6,46,.196); --on-accent:#ffffff;
  --ok:#218358; --warn:#ab6400; --bad:#ce2c31;
  --wall:radial-gradient(90% 80% at 12% 8%,#a9c8ff 0,transparent 60%),radial-gradient(80% 80% at 92% 12%,#f6c6e4 0,transparent 58%),radial-gradient(100% 90% at 78% 100%,#aee9dc 0,transparent 60%),radial-gradient(70% 70% at 10% 100%,#d9cdfb 0,transparent 60%),#e3e8f4;
  --menubar:rgba(255,255,255,.4);
  --highlight:inset 0 .5px 0 rgba(255,255,255,.8);
  --shadow-1:0 1px 3px rgba(0,0,0,.05);
  --shadow-2:0 8px 28px rgba(0,0,0,.15),0 1px 4px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.1);
  --shadow-3:0 32px 80px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.15),0 0 0 .5px rgba(0,0,0,.2);
  --t-large:26px; --t-title:20px; --t-head:15px; --t-body:14px; --t-note:12px; --t-tiny:11px;
  --r-xs:6px; --r-s:10px; --r-m:14px; --r-l:20px; --r-cap:999px;
  --ease-snappy:cubic-bezier(.2,.9,.3,1); --dur-snappy:.32s; --ease-smooth:cubic-bezier(.2,.85,.3,1); --dur-smooth:.5s;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Noto Sans CJK SC","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --canvas:#111113; --content:#18191b; --group:#18191b; --raised:#272a2d;
  --sidebar:rgba(33,34,37,.62); --mica:rgba(32,32,32,.92); --sidebar-solid:#18191b; --dev-name:#e2e8f0; --dev-muted:#8a8f98; --dev-on:#03a9f4; --dev-near:#4caf50; --dev-off:#616161; --dev-off-dot:#9e9e9e; --dev-sel:rgba(255,255,255,.1); --control:rgba(46,49,53,.68); --panel:rgba(33,34,37,.72); --scrim:rgba(0,0,0,.5);
  --ink:#edeef0; --ink2:#b0b4ba; --ink3:#777b84; --ink2-glass:rgba(241,247,254,.71);
  --sep:rgba(214,235,253,.188); --fill:rgba(221,234,248,.078); --fill2:rgba(211,237,248,.114); --sel:rgba(217,237,254,.145); --side-sel:rgba(255,255,255,.15); --side-sel-shadow:0 1px 3px rgba(0,0,0,.3),inset 0 .5px 0 rgba(255,255,255,.1); --bubble:#272a2d;
  --accent:#0090ff; --accent-text:#70b8ff; --tint:#0d2847; --tint-hover:#003362; --tint-active:#004074; --on-tint:#c2e6ff; --ok-solid:#30a46c; --warn-solid:#ffc53d; --bad-solid:#e5484d; --border:rgba(217,237,255,.251);
  --ok:#3dd68c; --warn:#ffca16; --bad:#ff9592;
  --wall:radial-gradient(90% 80% at 12% 8%,#1b3f8f 0,transparent 60%),radial-gradient(80% 80% at 92% 12%,#5a1f66 0,transparent 58%),radial-gradient(100% 90% at 78% 100%,#0d4f54 0,transparent 60%),radial-gradient(70% 70% at 10% 100%,#33206e 0,transparent 60%),#0a0c14;
  --menubar:rgba(0,0,0,.3);
  --highlight:inset 0 .5px 0 rgba(255,255,255,.15);
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 0 0 .5px rgba(255,255,255,.05);
  --shadow-2:0 8px 28px rgba(0,0,0,.5),0 1px 4px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.1);
  --shadow-3:0 32px 80px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.15);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --canvas:#111113; --content:#18191b; --group:#18191b; --raised:#272a2d;
  --sidebar:rgba(33,34,37,.62); --mica:rgba(32,32,32,.92); --sidebar-solid:#18191b; --dev-name:#e2e8f0; --dev-muted:#8a8f98; --dev-on:#03a9f4; --dev-near:#4caf50; --dev-off:#616161; --dev-off-dot:#9e9e9e; --dev-sel:rgba(255,255,255,.1); --control:rgba(46,49,53,.68); --panel:rgba(33,34,37,.72); --scrim:rgba(0,0,0,.5);
  --ink:#edeef0; --ink2:#b0b4ba; --ink3:#777b84; --ink2-glass:rgba(241,247,254,.71);
  --sep:rgba(214,235,253,.188); --fill:rgba(221,234,248,.078); --fill2:rgba(211,237,248,.114); --sel:rgba(217,237,254,.145); --side-sel:rgba(255,255,255,.15); --side-sel-shadow:0 1px 3px rgba(0,0,0,.3),inset 0 .5px 0 rgba(255,255,255,.1); --bubble:#272a2d;
  --accent:#0090ff; --accent-text:#70b8ff; --tint:#0d2847; --tint-hover:#003362; --tint-active:#004074; --on-tint:#c2e6ff; --ok-solid:#30a46c; --warn-solid:#ffc53d; --bad-solid:#e5484d; --border:rgba(217,237,255,.251);
  --ok:#3dd68c; --warn:#ffca16; --bad:#ff9592;
  --wall:radial-gradient(90% 80% at 12% 8%,#1b3f8f 0,transparent 60%),radial-gradient(80% 80% at 92% 12%,#5a1f66 0,transparent 58%),radial-gradient(100% 90% at 78% 100%,#0d4f54 0,transparent 60%),radial-gradient(70% 70% at 10% 100%,#33206e 0,transparent 60%),#0a0c14;
  --menubar:rgba(0,0,0,.3);
  --highlight:inset 0 .5px 0 rgba(255,255,255,.15);
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 0 0 .5px rgba(255,255,255,.05);
  --shadow-2:0 8px 28px rgba(0,0,0,.5),0 1px 4px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.1);
  --shadow-3:0 32px 80px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.15);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;background:var(--canvas);color:var(--ink);font:var(--t-body)/1.4 var(--sys);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default;-webkit-tap-highlight-color:transparent;transition:transform var(--dur-snappy) var(--ease-snappy),background-color .18s,color .18s,opacity .18s}
button:active:not(:disabled){transform:scale(.97)}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
svg{display:block;flex:none}
[hidden]{display:none!important}

/* ---------- 页面外壳（示意用，不属于产品） ---------- */
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px}
.try{display:flex;flex-wrap:wrap;align-items:center;gap:2px 2px;margin:0 0 12px;font-size:13px}
.try>span{color:var(--ink2);margin:0 6px 0 2px}
.try i{width:1px;height:14px;background:var(--sep);margin:0 8px}
.chip{padding:4px 9px;border-radius:var(--r-cap);color:var(--accent-text);font-size:13px}
.chip:hover{background:var(--fill)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.cap{font-size:12px;color:var(--ink2);margin:12px 2px 0;max-width:80ch}
code{font:12px/1.4 var(--mono)}

/* ---------- 桌面 ---------- */
.stage{position:relative;background:var(--wall);border-radius:var(--r-l);padding:0 26px 30px;overflow:hidden}
.menubar{height:26px;margin:0 -26px 16px;padding:0 12px;display:flex;align-items:center;justify-content:flex-end;gap:12px;font-size:12px;font-weight:500;color:var(--ink);background:var(--menubar);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6)}
.tray-btn{position:relative;display:flex;align-items:center;gap:0;height:22px;width:30px;justify-content:center;border-radius:var(--r-xs);color:var(--ink)}
.tray-btn:hover,.tray-btn[aria-expanded=true]{background:var(--fill2)}
.tray-dot{position:absolute;right:4px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--bad-solid)}
.stage[data-frame=phone] .menubar{display:none}
.stage[data-frame=phone]{padding-block:26px;display:flex;justify-content:center}

/* 窗口：侧栏透出桌面，内容是实色 */
.win{position:relative;display:flex;flex-direction:column;height:690px;border-radius:var(--r-m);overflow:hidden;box-shadow:var(--shadow-3);width:100%;isolation:isolate}
.body{position:relative;flex:1;min-height:0;display:flex}
.side{width:252px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--sidebar-solid);backdrop-filter:blur(44px) saturate(1.8);-webkit-backdrop-filter:blur(44px) saturate(1.8);box-shadow:inset -.5px 0 0 var(--sep)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--content);overflow:hidden}
.main.tint{background:var(--canvas)}
.insp{flex:none;width:0;overflow:hidden;position:relative;background:var(--canvas)}
.insp-in{width:296px;height:100%;overflow-y:auto;padding:22px 16px 24px;display:flex;flex-direction:column;gap:20px;box-shadow:inset .5px 0 0 var(--sep)}
.insp-in,.scroll,.side-list,.sheet,.pal-list,.tray,.st-body{scrollbar-width:thin;scrollbar-color:var(--fill2) transparent}
.win[data-size=regular] .insp{position:absolute;right:10px;top:56px;bottom:10px;width:296px;border-radius:var(--r-l);box-shadow:var(--shadow-2);z-index:6;transform-origin:top right}
.win[data-size=regular] .insp-in{box-shadow:none}

/* 平板和折叠屏：有侧栏，但还是触控，还是手机那一套功能 */
.win{--card-w:296px}
.win[data-input=touch]{--card-w:320px}
.insp-in{width:var(--card-w)}
.win[data-size=regular] .insp{width:var(--card-w)}
.win[data-input=touch]:not([data-size=compact]) .side{width:clamp(240px,32%,300px);padding-top:var(--status);background:var(--sidebar-solid);backdrop-filter:none;-webkit-backdrop-filter:none;--ink2:var(--ink2-solid)}
.win[data-input=touch]:not([data-size=compact]) .main{padding-top:var(--status)}
.win[data-input=touch]:not([data-size=compact]) .side-list .dev{min-height:68px;gap:12px;border-radius:var(--r-m);padding:10px 12px}
.win[data-input=touch] .side-list .dev .g{width:48px;height:48px;border-radius:50%;font-size:20px}
.win[data-input=touch] .side-list .dev small{margin-top:4px}
.win[data-input=touch]:not([data-size=compact]) .side-list{padding:0 10px 24px}
.win[data-input=touch]:not([data-size=compact]) .tb{height:50px}
.win[data-input=touch] .seg button{height:36px;padding:0 16px}
.win[data-input=touch] .seg button::before{content:"";position:absolute;inset:-6px 0}
.win[data-input=touch] .frow{min-height:48px}
.win[data-input=touch]{--status:28px}
.win[data-posture=book] .side{width:var(--hx)!important}
.win[data-posture=table][data-place=control] .side{display:none}
.side.unfold{animation:unfold .42s var(--ease-smooth) both}
@keyframes unfold{from{transform:translateX(-22%);opacity:0}to{transform:none;opacity:1}}
/* 设备外框只是示意，不属于产品 */
.dev-frame{display:contents}
.stage[data-frame=form]{padding-block:26px;display:flex;justify-content:center;overflow:hidden}
.stage[data-frame=form] .menubar{display:none}
.stage[data-frame=form] .dev-frame{display:flex;position:relative;gap:8px;flex:none;border-radius:var(--form-r);background:#000;box-shadow:0 0 0 7px #111,0 0 0 8px #2e3135,var(--shadow-3)}
.stage[data-frame=form] .win{border-radius:var(--form-r);box-shadow:none;flex:none}
.stage[data-frame=form][data-half=true] .win{border-radius:var(--form-r)}
.split-mate{display:none;flex:1;min-width:0;border-radius:var(--form-r);background:var(--canvas);color:var(--ink3);font-size:15px;place-items:center}
.dev-frame[data-split=true] .split-mate{display:grid}
.creases{position:absolute;inset:0;pointer-events:none;z-index:40;border-radius:inherit;overflow:hidden}
.creases i{position:absolute;display:block}
.creases i.v{top:0;bottom:0;width:14px;margin-left:-7px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.05) 50%,transparent)}
.creases i.h{left:0;right:0;height:14px;margin-top:-7px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.05) 50%,transparent)}
.creases.half i.v{width:90px;margin-left:-45px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.15) 49.5%,rgba(255,255,255,.15) 50%,rgba(0,0,0,.05) 54%,transparent)}
.creases.half i.h{height:90px;margin-top:-45px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.15) 49.5%,rgba(255,255,255,.15) 50%,rgba(0,0,0,.05) 54%,transparent)}
.form-dim{color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums;margin-left:6px}
/* 高度不够时：控制页把按键放到触控板右边 */
.win[data-short=true] .pad-wrap{flex-direction:row}
.win[data-short=true] .pad-b{width:110px;height:auto;grid-template-columns:1fr;grid-template-rows:1fr 1fr 1fr;flex:none}
.win[data-short=true] .conn-qr{flex-direction:row;flex-wrap:wrap;justify-content:center;column-gap:16px;text-align:left}
/* 桌面姿态：折痕以上看，折痕以下摸，像一台笔记本 */
.gs-table{position:absolute;inset:0;display:grid;grid-template-rows:calc(var(--hy) - var(--status) - 50px - 18px) 1fr;gap:36px;padding:0 16px 20px}
.gs-table .ctl-top{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;text-align:center}
.gs-table .ctl-top b{font-size:var(--t-head);font-weight:600}
.gs-table .ctl-top small{font-size:var(--t-note);color:var(--ink2)}
.gs-table .pad-wrap{min-height:0}

/* 手机 */
.win[data-input=touch]{--t-large:32px;--t-title:22px;--t-head:17px;--t-body:16px;--t-note:14px;--t-tiny:12px;font-size:var(--t-body);background:var(--canvas)}
.stage[data-frame=phone] .win{border-radius:46px;box-shadow:0 0 0 9px #111,0 0 0 10px #2e3135,var(--shadow-3)}
.win[data-size=compact] .side,.win[data-size=compact] .main{position:absolute;inset:0;width:auto;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.win[data-size=compact] .side{background:var(--content);padding-top:44px}
.win[data-size=compact] .main{padding-top:44px;will-change:transform;box-shadow:-12px 0 32px rgba(0,0,0,.1)}
.win[data-size=compact] .insp,.win[data-input=touch] .lights{display:none}
.stage[data-frame=phone] .win{width:min(380px,100%);height:780px}
.win[data-size=compact] .scroll,.win[data-size=compact] .side-list,.win[data-size=compact] .sheet{scrollbar-width:none}

/* 手机：所有能点的地方至少 48 高，看起来小的控件用透明命中区补足 */
.win[data-input=touch] .row{min-height:48px;padding-block:2px}
.win[data-input=touch] .row.stack{padding-block:10px 8px}
.win[data-input=touch] .sfield{height:44px}
.win[data-input=touch] .popb{position:relative}
.win[data-input=touch] .popb::before,.win[data-input=touch] .isl-c::before{content:"";position:absolute;inset:-7px 0}
.win[data-input=touch] .isl-c{position:relative}
.win[data-input=touch] .island{overflow:visible}
.win[data-input=touch] .island.open{overflow:hidden}
.win[data-input=touch] button.tb-title{height:48px;text-align:left}
.win[data-input=touch] .lks .tx{min-height:48px;display:flex;flex-direction:column;justify-content:center}
.win[data-input=touch] .field input[type=text],.win[data-input=touch] .field input[type=password]{height:44px}
.win[data-size=compact] .gs{padding-top:6px}

/* 玻璃上的文字 */
.win:not([data-size=compact]) .side,.tray,.menu,.palette,.fcard{--ink2:var(--ink2-glass)}
.win{--ink2-solid:var(--ink2)}
/* 侧栏 */
.lights{display:flex;gap:8px;padding:16px 16px 0}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.side-top{display:flex;align-items:center;justify-content:flex-end;gap:2px;padding:0 10px 4px;min-height:32px;margin-top:-22px}
.side-h1{flex:1;font-size:var(--t-large);font-weight:700;display:none;line-height:1.1}
.win[data-input=touch] .side-h1{display:block}
.win[data-input=touch] .side-top{padding:4px 4px 8px 18px;margin-top:0}
.win[data-input=touch] .side-top .iconbtn{color:var(--ink);width:44px}
.side-list{position:relative;flex:1;overflow-y:auto;padding:8px 10px 8px;min-height:0;display:flex;flex-direction:column;gap:2px}
/* 选中底是一个元素，在行之间滑动 */
.side-sel{position:absolute;left:10px;right:10px;top:0;height:0;border-radius:var(--r-m);background:var(--dev-sel);opacity:0;transition:opacity .18s;pointer-events:none}
.win[data-size=compact] .side-sel{display:none}
.win[data-size=compact] .side-list{padding:0 0 28px;display:block}
.sec{font-size:var(--t-tiny);font-weight:600;color:var(--ink2);padding:16px 10px 5px}
.dev{flex:none;width:100%;display:flex;align-items:center;gap:11px;min-height:60px;padding:0 10px;border-radius:var(--r-m);text-align:left;position:relative}
.dev:hover{background:var(--fill)}
.dev[aria-current=true]{background:none}
.dev .g{width:38px;height:38px;border-radius:50%;background:var(--dev-on);display:grid;place-items:center;color:#fff;font-size:16px;font-weight:600;flex:none}
.dev.seen .g{background:var(--dev-near)}
.dev.gone .g{background:var(--dev-off)}
.dev b{display:block;font-weight:600;font-size:14px;line-height:1.25;color:var(--dev-name);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dev small{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--dev-muted);line-height:1.25;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dev small .dot{width:7px;height:7px;border-radius:50%;background:var(--dev-on);flex:none}
.dev.seen small .dot{background:var(--dev-near)}
.dev.gone small .dot{background:var(--dev-off-dot)}
.dev small.live{color:var(--accent-text);font-weight:500}
.dev .t{min-width:0;flex:1}
.dev .c{color:var(--ink3);display:none}
.dev.flash::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--accent);opacity:0;animation:flash .8s ease-out}
@keyframes flash{0%{opacity:.3}100%{opacity:0}}
/* 手机：内缩分组 */
.win[data-size=compact] .side-list .dev{border-radius:0;padding:12px 16px 12px 18px;min-height:64px;gap:14px}
.win[data-size=compact] .side-list .dev:hover{background:none}
.win[data-size=compact] .side-list .dev[aria-current=true]{background:none}
.win[data-input=touch] .dev .g{width:44px;height:40px}
.win[data-size=compact] .side-list .dev+.dev::before{content:"";position:absolute;left:76px;right:0;top:0;height:.5px;background:var(--sep)}
.self{display:flex;align-items:center;gap:0;padding:6px 8px 10px 10px;min-height:46px}
.win[data-input=touch] .self{display:none}
.side-top .iconbtn[data-on=true],.self .iconbtn[data-on=true]{color:var(--accent-text)}
.side-top .iconbtn[aria-current=true],.self .iconbtn[aria-current=true]{background:var(--sel)}
.self-b{flex:1;min-width:0;display:flex;align-items:center;gap:7px;text-align:left;padding:5px 6px;border-radius:var(--r-s);color:var(--ink2)}
.self-b:hover{background:var(--fill)}
.self-b.lost{color:var(--warn)}
.self-b b{min-width:0;font-size:var(--t-note);font-weight:500;color:var(--ink);line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.vf{position:relative;aspect-ratio:1;width:min(100%,280px);align-self:center;border-radius:var(--r-l);overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#43484e,#111113 70%);display:grid;place-items:center;color:#fff;box-shadow:var(--shadow-1)}
.vf i{position:absolute;width:30px;height:30px;border:3px solid #fff;opacity:.92}
.vf .c1{left:18%;top:18%;border-right:0;border-bottom:0;border-top-left-radius:12px}.vf .c2{right:18%;top:18%;border-left:0;border-bottom:0;border-top-right-radius:12px}
.vf .c3{left:18%;bottom:18%;border-right:0;border-top:0;border-bottom-left-radius:12px}.vf .c4{right:18%;bottom:18%;border-left:0;border-top:0;border-bottom-right-radius:12px}
.vf .ln{position:absolute;left:20%;right:20%;height:2px;border-radius:1px;background:#fff;opacity:.75;animation:scan 2.4s ease-in-out infinite alternate}
@keyframes scan{from{top:22%}to{top:78%}}
.vf small{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:var(--t-note);color:rgba(255,255,255,.9)}
.circ.act .o{background:var(--group);color:var(--accent-text);box-shadow:var(--shadow-1)}
.circ.act:hover .o{background:var(--group)}
.circs.act3{max-width:300px;margin-inline:auto;width:100%}

/* 工具栏：融进内容，滚动后才有边 */
.tb{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 20px;position:relative;z-index:2;background:var(--content);transition:box-shadow .2s}
.main.tint .tb{background:transparent}
.main.scrolled .tb{box-shadow:0 .5px 0 var(--sep)}
.tb-title{min-width:0;flex:1 1 0;max-width:34%}
.win[data-size=compact] .tb-title{max-width:none}
.tb-title b{display:block;font-size:var(--t-head);font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-end{flex:none;margin-left:auto;display:flex;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.iconbtn{width:28px;height:28px;border-radius:var(--r-xs);display:grid;place-items:center;color:var(--ink2);flex:none}
.iconbtn:hover{background:var(--fill)}
.iconbtn[aria-pressed=true]{color:var(--accent-text);background:var(--fill)}
.win[data-input=touch] .iconbtn{width:48px;height:48px}
.back{display:none}
.back.show{display:grid;color:var(--ink);margin-right:-8px}
.win[data-size=compact] .tb{padding:0 4px;height:50px;gap:0}
.win[data-size=compact] .back{display:grid;color:var(--ink);margin-right:-8px}
.win[data-size=compact] .tb-title{padding-left:6px;text-align:left}
.win[data-input=touch] .tb-end{gap:0}
.win[data-input=touch] .tb-end .iconbtn{color:var(--ink);width:44px;height:48px}
.seg{position:relative;display:inline-flex;padding:2px;border-radius:var(--r-cap);background:var(--fill);flex:none}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:0;border-radius:var(--r-cap);background:var(--raised);box-shadow:0 1px 3px rgba(0,0,0,.15),0 0 0 .5px rgba(0,0,0,.05)}
.seg button{position:relative;display:flex;align-items:center;gap:5px;height:26px;padding:0 14px;font-size:var(--t-note);font-weight:500;color:var(--ink);border-radius:var(--r-cap)}
.seg button:active:not(:disabled){transform:none}
.miniseg{position:relative;display:inline-flex;padding:2px;border-radius:var(--r-cap);background:var(--fill)}
.miniseg button{position:relative;z-index:1;height:22px;min-width:32px;padding:0 9px;font-size:var(--t-tiny);font-weight:500;border-radius:var(--r-cap);color:var(--ink)}
.miniseg button:active:not(:disabled){transform:none}
.mthumb{position:absolute;top:2px;bottom:2px;left:0;width:0;border-radius:var(--r-cap);background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.15),0 0 0 .5px rgba(0,0,0,.05);transition:transform var(--dur-snappy) var(--ease-snappy),width var(--dur-snappy) var(--ease-snappy)}
.win[data-input=touch] .miniseg button{height:30px;min-width:40px;font-size:var(--t-note)}

/* 内容区 */
.place{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.place.enter{animation:enter .34s var(--ease-smooth) both}
.win[data-size=compact] .place{background:var(--content)}
.win[data-size=compact] .main.tint .place{background:var(--canvas)}
.place.p-in{animation:pIn var(--dur-smooth) var(--ease-smooth) both;z-index:2;box-shadow:-12px 0 32px rgba(0,0,0,.1)}
.place.b-in{animation:bIn var(--dur-smooth) var(--ease-smooth) both;z-index:1}
.place.ghost{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
.place.p-out{animation:pOut var(--dur-smooth) var(--ease-smooth) both;z-index:1}
.place.b-out{animation:bOut var(--dur-smooth) var(--ease-smooth) both;z-index:2;box-shadow:-12px 0 32px rgba(0,0,0,.1)}
@keyframes pIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes bIn{from{transform:translateX(-26%)}to{transform:none}}
@keyframes pOut{to{transform:translateX(-26%)}}
@keyframes bOut{to{transform:translateX(100%)}}
@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.scroll{flex:1;min-height:0;overflow-y:auto}
.win[data-size=compact] .scroll{padding-bottom:24px}
.win[data-size=compact] .chat-scroll{padding-bottom:0}

/* 分页切换：旧页带着模糊退向一边，新页从另一边进来 */
.place.t-in-r{animation:tInR var(--dur-smooth) var(--ease-smooth) both}
.place.t-in-l{animation:tInL var(--dur-smooth) var(--ease-smooth) both}
.place.t-out-r{animation:tOutR var(--dur-smooth) var(--ease-smooth) both}
.place.t-out-l{animation:tOutL var(--dur-smooth) var(--ease-smooth) both}
.side-list.t-in-r{animation:tInR var(--dur-smooth) var(--ease-smooth) both}
.side-list.t-in-l{animation:tInL var(--dur-smooth) var(--ease-smooth) both}
.side-list.ghost{position:absolute;left:0;right:0;pointer-events:none}
.side-list.t-out-r{animation:tOutR var(--dur-smooth) var(--ease-smooth) both}
.side-list.t-out-l{animation:tOutL var(--dur-smooth) var(--ease-smooth) both}
@keyframes tInR{from{transform:translate3d(9%,0,0);opacity:0}to{transform:none;opacity:1}}
@keyframes tInL{from{transform:translate3d(-9%,0,0);opacity:0}to{transform:none;opacity:1}}
@keyframes tOutR{to{transform:translate3d(-9%,0,0);opacity:0}}
@keyframes tOutL{to{transform:translate3d(9%,0,0);opacity:0}}
.rise{animation:riseIn var(--dur-smooth) var(--ease-smooth) both;animation-delay:calc(var(--i,0)*24ms)}
@keyframes riseIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.ihero b{overflow-wrap:anywhere}

/* 消息 */
.chat{padding:8px 16px 84px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:100%}
.win[data-size=compact] .chat{padding:8px 12px 92px}
.when{align-self:center;font-size:var(--t-tiny);color:var(--ink2);margin:14px 0 8px}
.bub{align-self:flex-start;width:fit-content;max-width:min(72%,30em);padding:7px 13px;border-radius:18px;background:var(--bubble);font-size:var(--t-body);line-height:1.45;overflow-wrap:anywhere;margin-top:8px}
.bub+.bub{margin-top:0}
.bub.me+.bub:not(.me),.bub:not(.me)+.bub.me{margin-top:8px}
.win[data-size=compact] .bub{max-width:min(80%,30em)}
.bub.me{align-self:flex-end;background:var(--tint-hover);color:var(--on-tint)}
.in{animation:rise .5s var(--ease-smooth) both;transform-origin:100% 100%}
@keyframes rise{from{transform:translateY(26px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.fcard{display:flex;align-items:center;gap:11px;width:min(276px,82%);padding:10px 12px;border-radius:18px;background:var(--bubble);margin-top:6px}
.fcard.me{align-self:flex-end}
.fcard b{display:block;font-weight:500;font-size:var(--t-body);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard small{font-size:var(--t-note);color:var(--ink2);font-variant-numeric:tabular-nums}
.fcard .t{min-width:0;flex:1}
.fbar{height:4px;border-radius:2px;background:var(--fill2);margin-top:6px;overflow:hidden}
.fbar i{position:relative;display:block;height:100%;background:var(--accent);width:0;border-radius:2px;overflow:hidden;transition:width .24s linear}
.fbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:sheen 1.8s ease-in-out infinite}
@keyframes sheen{to{transform:translateX(100%)}}
.composer{position:absolute;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 96px));bottom:16px;display:flex;align-items:center;gap:4px;padding:5px;border-radius:var(--r-cap);background:var(--control);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:var(--shadow-2),var(--highlight);z-index:3}
.win[data-size=compact] .composer{width:calc(100% - 36px);bottom:24px}
.composer .iconbtn{border-radius:50%;color:var(--ink2)}
.composer input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:var(--t-body);padding:0 4px;height:28px}
.composer input{text-overflow:ellipsis}
.send{position:relative;width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--ink);display:grid;place-items:center;flex:none;transition:background-color .18s,color .18s,transform var(--dur-snappy) var(--ease-snappy)}
.send svg{position:absolute;inset:0;margin:auto;transition:transform var(--dur-snappy) var(--ease-snappy),opacity .14s}
.send svg.up{transform:scale(.5) rotate(-90deg);opacity:0}
.send.ready{background:var(--accent);color:var(--on-accent)}
.send.ready svg.up{transform:none;opacity:1}
.send.ready svg.add{transform:scale(.5) rotate(90deg);opacity:0}
.win[data-input=touch] .send{width:38px;height:38px;margin:5px}
.att{display:flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 3px;border-radius:var(--r-s);background:var(--fill);font-size:var(--t-note);flex:none;animation:barin2 .4s var(--ease-smooth) both;max-width:200px}
@keyframes barin2{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.att i{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,#3e63dd,#6e56cf);flex:none}
.att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}

/* 文件：像访达，不画线 */
.win[data-size=compact] .fhead{padding-inline:5px 4px}
.fhead{display:flex;align-items:center;gap:2px;padding:0 20px 8px;font-size:var(--t-note);color:var(--ink2);flex:none;min-height:24px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.fhead .cur{color:var(--ink);font-weight:500;padding:2px 5px}
.fhead .cnt{margin-left:auto;padding-left:12px}
.fcols,.frow{display:grid;grid-template-columns:20px minmax(0,1fr) 84px 76px;gap:10px;align-items:center}
.fcols{padding:0 26px 3px;font-size:var(--t-tiny);color:var(--ink2);flex:none}
.frow{width:calc(100% - 24px);margin-inline:12px;padding:0 14px;min-height:30px;text-align:left;font-size:var(--t-body);border-radius:var(--r-xs)}
.frow:active:not(:disabled){filter:none}
.frow:hover{background:var(--fill)}
.frow[aria-selected=true]{background:var(--accent);color:var(--on-accent)}
.frow[aria-selected=true] small{color:#fff}
.frow .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow small{font-size:var(--t-note);color:var(--ink2);font-variant-numeric:tabular-nums}
.win[data-size=compact] .fcols{display:none}
.win[data-size=compact] .frow{width:calc(100% - 16px);margin-inline:8px}
.win[data-size=compact] .frow{grid-template-columns:24px minmax(0,1fr) auto;padding:10px 12px;min-height:48px;border-radius:var(--r-s)}
.win[data-size=compact] .frow small.date{display:none}
.float-bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:2px;padding:5px;border-radius:var(--r-cap);background:var(--control);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:var(--shadow-2),var(--highlight);z-index:3;white-space:nowrap;animation:barin .46s var(--ease-smooth) both;max-width:calc(100% - 16px)}
@keyframes barin{from{opacity:0;transform:translate(-50%,14px) scale(.94)}to{opacity:1;transform:translate(-50%,0)}}
.win[data-size=compact] .float-bar{bottom:24px}
.btn{height:28px;padding:0 13px;border-radius:var(--r-cap);font-size:var(--t-note);font-weight:500;background:var(--fill);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;flex:none}
.btn:hover{background:var(--fill2)}
.btn.p{background:var(--accent);color:var(--on-accent)}
.btn.p:hover{background:color-mix(in srgb,var(--accent) 90%,#000)}
.btn.q{background:none;color:var(--accent-text)}
.btn.q:hover{background:var(--fill)}
.pair{height:100%;display:flex;flex-direction:column}
.pair-mid{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;text-align:center}
.pair-devs{display:flex;align-items:center;margin-bottom:28px}
.pair-devs>i{width:4px;height:4px;margin:0 3px;border-radius:50%;background:var(--ink3)}
.pair-devs>i:first-of-type{margin-left:16px}
.pair-devs>i:last-of-type{margin-right:16px}
.pair-devs .lk{width:32px;height:32px;margin:0 6px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink2)}
.pair-mid b{font-size:var(--t-title);font-weight:600;line-height:1.3}
.pair-mid p{margin-top:8px;font-size:var(--t-note);line-height:1.5;color:var(--ink2)}
.code.digits{display:flex;margin-top:28px;gap:6px;letter-spacing:0}
.code.digits span{width:44px;height:58px;border-radius:var(--r-m);background:var(--fill);display:grid;place-items:center;font-family:var(--mono);font-size:30px;font-weight:600}
.code.digits .gap{width:4px}
.pair-end{display:flex;flex-direction:column;gap:4px;padding:12px 20px 12px}
.pair-end .btn{width:100%}
.pair-end small{margin-top:4px;text-align:center;font-size:var(--t-tiny);line-height:1.4;color:var(--ink3)}
.tb-cap{display:inline-flex;align-items:center;flex:none;height:30px;padding:2px;border-radius:var(--r-cap);background:var(--fill)}
.tb-cap>button,.tb-cap>span{width:28px;height:26px;border-radius:var(--r-cap);display:grid;place-items:center;color:var(--ink);transition:background-color .15s}
.tb-cap>button[aria-pressed=true]{background:var(--raised);box-shadow:var(--shadow-1)}
.tb-cap .tb-conn{color:var(--accent-text)}
.tb-cap .tb-conn.off{color:var(--bad)}
.win[data-input=touch] .tb-cap{height:36px}
.win[data-size=compact] .tb-cap{margin-right:8px}
.win[data-input=touch] .tb-cap>button,.win[data-input=touch] .tb-cap>span{width:38px;height:32px}
.tb-conn .spin{width:13px;height:13px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 30%,transparent);border-top-color:var(--accent-text);animation:tbspin .8s linear infinite}
@keyframes tbspin{to{transform:rotate(360deg)}}
.btn.d{background:var(--bad-solid);color:#fff}
.btn.lg{height:36px;padding:0 20px;font-size:var(--t-body)}
.win[data-input=touch] .btn{height:44px;padding:0 16px}
.win[data-input=touch] .btn.lg{height:48px}

.apps{padding:4px 20px 30px;display:flex;flex-direction:column;gap:24px}
.apps h4{margin:0 0 10px;font-size:var(--t-note);font-weight:600;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px 6px}
.appi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;border-radius:var(--r-s);font-size:var(--t-tiny);text-align:center;line-height:1.3}
.appi:hover{background:var(--fill)}
.appi .ic{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:21px;font-weight:600;box-shadow:inset 0 .5px 0 rgba(255,255,255,.4),0 1px 3px rgba(0,0,0,.2)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.thumb-w{text-align:left;border-radius:var(--r-s);padding:0;display:block}
.thumb-w:hover .shot{box-shadow:0 0 0 3px var(--accent)}
.thumb-w .shot{display:flex;height:96px;padding:12px;flex-direction:column;gap:6px;border-radius:var(--r-s);background:var(--canvas);box-shadow:var(--shadow-1);transition:box-shadow .18s}
.thumb-w .shot i{display:block;height:6px;border-radius:3px;background:var(--fill2)}
.thumb-w .shot i:nth-child(1){width:46%;background:var(--ink3)}
.thumb-w .shot i:nth-child(3){width:70%}
.thumb-w .cap2{display:block;padding:7px 2px 0;font-size:var(--t-tiny);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:var(--ink2)}
.empty b{font-size:var(--t-title);font-weight:600;color:var(--ink)}
.empty p{margin:0 0 6px;max-width:32ch;font-size:var(--t-body);line-height:1.5}
.code{font:600 30px/1 var(--mono);letter-spacing:.22em;color:var(--ink);margin:2px 0 8px;padding-left:.22em}

/* 内缩分组：白色块放在画布上，行之间是缩进的细线 */
.pane{padding:0 20px 28px;display:flex;flex-direction:column;gap:18px;max-width:620px;width:100%;margin-inline:auto}
.win[data-size=compact] .pane{padding:0 16px 28px}
.pane-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:6px 0 4px}
.pane-hero b{font-size:var(--t-title);font-weight:600;margin-top:8px}
.pane-hero small{font-size:var(--t-body);color:var(--ink2);max-width:40ch}
.glabel{font-size:var(--t-note);font-weight:500;color:var(--ink2);padding:0 12px 6px}
.group{background:var(--group);border-radius:var(--r-m);overflow:hidden;box-shadow:var(--shadow-1)}
.row{position:relative;display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 12px;font-size:var(--t-body);width:100%;text-align:left;line-height:1.3}
.row+.row::before,.row-x+.row-x::before,.exp+.row::before,.row-x+.row::before{content:"";position:absolute;left:var(--inset,12px);right:0;top:0;height:.5px;background:var(--sep)}
@media (max-resolution:1.5dppx){.row+.row::before,.row-x+.row-x::before,.exp+.row::before,.row-x+.row::before{height:1px}}
.row-x{position:relative}
.row.dim{opacity:.5}
.row .sp{flex:1;min-width:0}
.row .tx{flex:1;min-width:0}
.row .tx b{display:flex;align-items:center;gap:5px;font-weight:400;font-size:var(--t-body)}
.row .tx b span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .tx small{display:block;font-size:var(--t-note);color:var(--ink2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .tx small.warn{color:var(--warn)}
.row small.val{color:var(--ink2);font-size:var(--t-body)}
.row code{font-size:12px;color:var(--ink2)}
button.row:hover{background:var(--fill)}
button.row:active:not(:disabled){transform:none;background:var(--fill2)}
.foot-note{font-size:var(--t-note);color:var(--ink2);line-height:1.5;margin:6px 12px 0}
.check{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink3);display:grid;place-items:center;color:transparent;flex:none;transition:background-color .18s,box-shadow .18s,transform var(--dur-snappy) var(--ease-snappy)}
.check[aria-checked=true]{background:var(--accent);box-shadow:none;color:#fff}
.sw{position:relative;width:38px;height:22px;border-radius:11px;background:var(--fill2);flex:none;transition:background-color .22s}
.sw:active:not(:disabled){transform:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.05);transition:transform var(--dur-snappy) var(--ease-snappy),width .18s}
.sw:active::after{width:22px}
.sw[aria-checked=true]{background:var(--accent)}
.sw[aria-checked=true]::after{transform:translateX(16px)}
.sw[aria-checked=true]:active::after{transform:translateX(12px)}
.sw:disabled{opacity:.5}
.win[data-input=touch] .sw::before{content:"";position:absolute;inset:-13px -5px}
.linkbtn{font-size:var(--t-note);color:var(--accent-text);padding:2px 12px;align-self:flex-start}
.linkbtn.bad{color:var(--bad)}
/* 展开：高度也走弹簧 */
.exp{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-smooth) var(--ease-smooth)}
.exp.open{grid-template-rows:1fr}
.exp>div{overflow:hidden;min-height:0;opacity:0;transition:opacity .22s}
.exp.open>div{opacity:1}

/* 设备卡片 */
.ihero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.ihero b{font-size:var(--t-title);font-weight:600;line-height:1.25;margin-top:10px}
.ihero small{font-size:var(--t-note);color:var(--ink2)}
.circs{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:4px}
.circ{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:var(--t-tiny);text-align:center;line-height:1.25;min-width:0}
.circ .o{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink);transition:background-color .2s,color .2s,transform var(--dur-snappy) var(--ease-snappy)}
.circ:hover .o{background:var(--fill2)}
.circ:active:not(:disabled){transform:none}
.circ:active:not(:disabled) .o{transform:scale(.92)}
.circ[aria-pressed=true] .o{background:var(--accent);color:#fff}
.circ:disabled{opacity:.45}
.circ small{display:block;color:var(--ink2);font-size:var(--t-tiny);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* 键鼠：像系统设置里的显示器排列 */
.gs{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 20px 14px;gap:14px}
.win[data-size=compact] .gs{padding:0 16px 28px}
.kb-canvas{position:relative;flex:1;min-height:240px;border-radius:var(--r-m);background:var(--fill);box-shadow:inset 0 1px 3px rgba(0,0,0,.05),inset 0 0 0 .5px var(--sep);overflow:hidden;touch-action:none}
.scr{position:absolute;left:0;top:0;cursor:grab;user-select:none;touch-action:none;color:#fff;border-radius:var(--r-xs);display:grid;place-items:center;text-align:center;transition:filter .2s}
.scr.self{cursor:default}
.scr.drag{z-index:4;cursor:grabbing;filter:drop-shadow(0 14px 22px rgba(0,0,0,.3))}
.scr.sel::after{content:"";position:absolute;inset:-3px;border-radius:9px;box-shadow:0 0 0 2.5px var(--accent);pointer-events:none}
.disp{position:absolute;display:block;border-radius:var(--r-xs);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.2)}
.disp::before{content:"";position:absolute;left:0;right:0;top:0;height:7%;min-height:4px;background:rgba(255,255,255,.4)}
.disp::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.3))}
.scr.ghostly .disp{filter:grayscale(1);opacity:.42}
.scr.ghostly{color:var(--ink)}
.lb{position:relative;z-index:1;display:block;min-width:0;max-width:100%;padding:2px 6px;pointer-events:none}
.scr b{display:block;font-size:var(--t-note);font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.scr small{display:block;font-size:var(--t-tiny);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.scr.ghostly b,.scr.ghostly small{text-shadow:none}
.kb-ghost{position:absolute;left:0;top:0;border-radius:var(--r-xs);background:color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:inset 0 0 0 1.5px var(--accent);pointer-events:none;z-index:2}
.kb-ptr{position:absolute;left:0;top:0;z-index:5;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.bench{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:34px}
.bchip{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 6px;border-radius:var(--r-cap);background:var(--group);box-shadow:var(--shadow-1);font-size:var(--t-note);font-weight:500;touch-action:none;user-select:none}
.bchip:hover:not(:disabled){background:var(--raised)}
.bchip .mini{width:32px;height:22px;border-radius:4px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.bchip small{font-size:var(--t-tiny);color:var(--ink2);font-weight:400}
.bchip:disabled{opacity:.55;box-shadow:none;background:var(--fill)}
.bchip:disabled .mini{filter:grayscale(1)}
.gs-foot{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--t-note);color:var(--ink2);min-height:28px}
.gs-foot b{color:var(--ink);font-weight:600}
.gs-foot .sp{flex:1;min-width:8px}
.gs-foot .warn{color:var(--warn)}
kbd{font:var(--t-tiny)/1 var(--sys);padding:3px 6px;border-radius:var(--r-xs);background:var(--group);box-shadow:var(--shadow-1);color:var(--ink)}
.pad-wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.pad{flex:1;min-height:200px;border-radius:var(--r-l);background:var(--group);box-shadow:var(--shadow-1);display:grid;place-items:center;color:var(--ink2);font-size:var(--t-note)}
.pad-b{display:grid;grid-template-columns:1fr 64px 1fr;gap:6px;height:88px}
.pad-b span{display:grid;place-items:center;border-radius:var(--r-m);background:var(--group);box-shadow:var(--shadow-1);font-size:var(--t-note);color:var(--ink2)}

/* 声音 */
.pane{container-type:inline-size}
.row-a .popb{display:none}
@container (max-width:520px){.row-a .miniseg{display:none}.row-a .popb{display:inline-flex}}
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:18px;margin-top:6px}
.wave i{width:3px;height:100%;border-radius:2px;background:var(--accent);transform:scaleY(.18);transform-origin:center;transition:opacity .3s}
.wave.live i{animation:wave 1.1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:-.2s}.wave i:nth-child(3){animation-delay:-.55s}.wave i:nth-child(4){animation-delay:-.8s}.wave i:nth-child(5){animation-delay:-.35s}
.wave:not(.live) i{background:var(--ink3)}
@keyframes wave{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
.role{padding:0 12px 10px 12px;font-size:var(--t-note);color:var(--ink2)}
.row-a{min-height:60px}
.row-a .miniseg{flex:none;padding:3px}
.row-a .mthumb{top:3px;bottom:3px}
.row-a .miniseg button{height:30px;min-width:42px;padding:0 12px;font-size:var(--t-note)}
.detail{font-variant-numeric:tabular-nums}
.row-a .q{flex:none;font-style:normal;font-size:var(--t-note);font-weight:400;color:var(--ink2);margin-left:3px}
.row-a .q.warn{color:var(--warn)}

/* 共享链接：没有线，图标就是文件本身 */
.lks .row{min-height:60px;padding:8px 14px;gap:12px}
.lks .row+.row::before{display:none}
.lks .fic{width:30px;display:grid;place-items:center;flex:none;transition:opacity .2s}
.lks .off .fic{opacity:.45}
.lks .off .tx b{color:var(--ink2)}
.lks .tx small{display:flex;align-items:center;gap:4px}
.lks .tx small svg{color:var(--warn)}
.lks .more{opacity:0;margin-right:-6px;transition:opacity .15s}
.lks .row:hover .more,.lks .more:focus-visible{opacity:1}
.win[data-input=touch] .lks .more{display:none}
.li{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--fill);color:var(--ink2);flex:none;transition:background-color .2s,color .2s}
.li.on{background:var(--accent);color:#fff}
.qr{width:148px;height:148px;margin:0 auto;padding:10px;border-radius:var(--r-m);background:#fff;color:#111;box-shadow:var(--shadow-1)}
.field{display:flex;flex-direction:column;gap:5px;font-size:var(--t-note);color:var(--ink2)}
.field input[type=text],.field input[type=password]{height:34px;border-radius:var(--r-s);border:0;background:var(--fill);padding:0 11px;font-size:var(--t-body);color:var(--ink);outline:0;transition:box-shadow .18s}
.field input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}

/* 设置里的控件：看得出能改，也看得出怎么改 */
.sfield{height:28px;border:0;background:none;outline:0;text-align:right;color:var(--ink2);font-size:var(--t-body);min-width:0;width:200px;padding:0 8px;border-radius:var(--r-xs);transition:background-color .15s,color .15s}
.sfield:hover{background:var(--fill)}
.sfield:focus{background:var(--fill);color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.popb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 11px;border-radius:var(--r-s);background:var(--fill);font-size:var(--t-note);font-weight:500;flex:none}
.popb:hover{background:var(--fill2)}
.popb svg{color:var(--ink2)}
.slider{display:flex;align-items:center;gap:10px;flex:1;min-width:0;max-width:240px;margin-left:auto}
/* 声音页的增益：够用就好，标签和滑块放在一起，不撑满整列 */
.group.gain{width:min(320px,100%);margin-inline:auto}
.gain .row{gap:12px}
.gain .slider{max-width:none;margin-left:0}
.slider input{flex:1;min-width:0}
.slider output{min-width:38px;text-align:right;font-size:var(--t-note);color:var(--ink2);font-variant-numeric:tabular-nums}
.hk{height:28px;min-width:76px;padding:0 10px;border-radius:var(--r-s);background:var(--fill);font-size:var(--t-note);font-weight:500;font-variant-numeric:tabular-nums;flex:none}
.hk:hover{background:var(--fill2)}
.hk.rec{background:var(--accent);color:#fff}
.pathv{min-width:0;flex:0 1 auto;color:var(--ink2);font-size:var(--t-note);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
.win[data-input=touch] .popb,.win[data-input=touch] .hk{height:34px;font-size:var(--t-note)}
.win[data-input=touch] .slider{max-width:190px}

/* 滑块：一条细轨道加一个胶囊滑块，按住时滑块变大。--f 是 0 到 1 的进度 */
input[type=range]{-webkit-appearance:none;appearance:none;background:none;margin:0;height:28px;padding:0;--f:0;--tw:26px;outline-offset:4px}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) calc(var(--tw)/2 + (100% - var(--tw))*var(--f)),var(--fill2) calc(var(--tw)/2 + (100% - var(--tw))*var(--f)))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:var(--tw);height:18px;margin-top:-6px;border-radius:9px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.1);transition:transform var(--dur-snappy) var(--ease-snappy)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.04)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.16,1.1)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--fill2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:var(--tw);height:18px;border:0;border-radius:9px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.1)}
.win[data-input=touch] input[type=range]{height:32px;--tw:30px}

/* 窄屏的滑块单独占一行：标题和数值在上，滑块铺满 */
.row.stack{flex-direction:column;align-items:stretch;gap:2px;padding-block:10px 8px}
.row.stack .st-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row.stack output{font-size:var(--t-note);color:var(--ink2);font-variant-numeric:tabular-nums}
.row.stack input{width:100%;margin:2px 0 0}
.row.stack small.hint{font-size:var(--t-tiny);color:var(--ink2);line-height:1.4}

/* 连接设备：二维码、扫码、地址 */
.seg.full{display:flex;width:100%}
.seg.full button{flex:1;justify-content:center;height:32px;padding:0}
.conn{display:flex;flex-direction:column;gap:16px}
.conn.swap-r{animation:tInR var(--dur-smooth) var(--ease-smooth) both}
.conn.swap-l{animation:tInL var(--dur-smooth) var(--ease-smooth) both}
.conn-qr{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:22px 16px 18px;background:var(--group);border-radius:var(--r-l);box-shadow:var(--shadow-1)}
.conn-qr .qr{width:196px;height:196px;box-shadow:none;margin-bottom:10px}
.conn-qr b{font-size:var(--t-head);font-weight:600;overflow-wrap:anywhere}
.conn-qr small{font-size:var(--t-note);color:var(--ink2)}
.vf-tools{display:flex;justify-content:center;gap:16px}
.vf-b{width:48px;height:48px;border-radius:50%;background:var(--group);box-shadow:var(--shadow-1);display:grid;place-items:center;color:var(--ink)}
.vf-b[aria-pressed=true]{background:var(--accent);color:#fff}

.about{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.about i{width:64px;height:64px;border-radius:50%;margin-bottom:8px;padding:2px;background:linear-gradient(135deg,#299be2,#40a7ac 50%,#8cd23b);-webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.about b{font-size:var(--t-title);font-weight:600}
.about small{font-size:var(--t-note);color:var(--ink2)}

/* 设置：像系统设置 */
.sheet.settings{width:min(780px,calc(100% - 32px));height:min(560px,calc(100% - 40px));padding:0;overflow:hidden;background:var(--canvas)}
.st{display:flex;height:100%;min-height:0}
.st-nav{width:224px;flex:none;padding:24px 12px 16px;background:var(--sidebar);box-shadow:inset -.5px 0 0 var(--sep);overflow-y:auto}
.sheet .st-nav h3{font-size:var(--t-title);font-weight:600;margin:0 10px 16px}
.st-nav button{width:100%;text-align:left;min-height:36px;padding:0 10px;margin-bottom:2px;border-radius:var(--r-s);font-size:var(--t-body);display:flex;align-items:center;gap:10px}
.st-nav button:hover{background:var(--fill)}
.st-nav button[aria-current=true]{background:var(--sel);font-weight:500}
.st-nav button:active:not(:disabled){transform:none}
.sti{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 .5px 0 rgba(255,255,255,.3);flex:none}
.st-body{flex:1;min-width:0;padding:24px 28px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.st-body h4{margin:0;font-size:var(--t-title);font-weight:600}
.st-close{position:absolute;right:10px;top:10px}

/* 灵动岛 */
.island{position:absolute;left:var(--islx,50%);transition:left var(--dur-smooth) var(--ease-smooth),top var(--dur-smooth) var(--ease-smooth);top:var(--isly,9px);transform:translateX(-50%);z-index:40;background:#000;color:#fff;overflow:hidden;border-radius:17px;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:calc(100% - 24px)}
.island.open{border-radius:26px;box-shadow:0 16px 44px rgba(0,0,0,.4)}
.win[data-size=compact] .island{top:11px}
.isl-in{position:absolute;left:0;top:0}
.isl-c{display:flex;align-items:center;gap:7px;height:34px;padding:0 13px 0 10px;font-size:var(--t-note);font-weight:500;color:inherit;white-space:nowrap;max-width:260px}
.isl-c:active:not(:disabled){transform:none}
.isl-c .tx{overflow:hidden;text-overflow:ellipsis;min-width:0}
.isl-c .val{font-variant-numeric:tabular-nums;color:rgba(255,255,255,.6)}
.isl-c .more{min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:rgba(255,255,255,.2);font-size:var(--t-tiny);display:grid;place-items:center;margin-left:1px}
.isl-e{width:372px;max-width:calc(var(--winw,372px) - 24px);padding:10px;display:flex;flex-direction:column;gap:2px}
.mo{display:flex;align-items:center;gap:10px;padding:7px}
.mo .ld{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none}
.mo .t{flex:1;min-width:0}
.mo b{display:block;font-size:var(--t-note);font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo small{display:block;font-size:var(--t-tiny);line-height:1.35;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.mo .rb{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;color:inherit;flex:none}
.mo-acts{display:flex;gap:6px;padding:0 7px 7px 49px;flex-wrap:wrap}
.mo-acts button{height:30px;padding:0 14px;border-radius:15px;background:rgba(255,255,255,.15);color:inherit;font-size:var(--t-note);font-weight:500}
.mo-acts button.p{background:#fff;color:#000}
.ask{display:flex;flex-direction:column;padding:12px 7px 7px;text-align:center}
.ask-t{display:grid;place-items:center;margin-bottom:10px}
.ask b{display:block;font-size:var(--t-head);font-weight:600;line-height:1.25}
.ask small{display:block;margin-top:4px;font-size:var(--t-note);line-height:1.4;color:rgba(255,255,255,.6)}
.ask-code{margin-top:12px;font-family:var(--mono);font-size:30px;line-height:1.2;font-weight:600;letter-spacing:2px}
.ask-acts{display:flex;gap:6px;margin-top:16px}
.ask-acts button{flex:1;min-width:0;height:34px;padding:0 10px;border-radius:17px;background:rgba(255,255,255,.15);color:inherit;font-size:var(--t-note);font-weight:600;white-space:nowrap}
.ask-acts button.p{background:#fff;color:#000}
.eq{display:flex;align-items:center;gap:2px;height:14px}
.eq i{width:2.5px;height:100%;border-radius:1px;background:currentColor;animation:wave 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.62s}

/* 浮层 */
#overlay{position:absolute;inset:0;pointer-events:none;z-index:30}
#overlay>*{pointer-events:auto}
.menu{position:absolute;min-width:190px;max-width:min(320px,calc(100% - 20px));padding:5px;border-radius:var(--r-m);background:var(--panel);backdrop-filter:blur(36px) saturate(1.8);-webkit-backdrop-filter:blur(36px) saturate(1.8);box-shadow:var(--shadow-2),var(--highlight);z-index:35;animation:menuin .36s var(--ease-smooth) both}
.stage[data-frame=phone] .menu{min-width:210px}
@keyframes menuin{from{opacity:0;transform:scale(.92) translateY(-6px)}to{opacity:1;transform:none}}
.menu h5{margin:0;padding:5px 9px 4px;font-size:var(--t-tiny);font-weight:500;color:var(--ink2)}
.mi{width:100%;display:flex;align-items:center;gap:9px;min-height:30px;padding:4px 9px;border-radius:var(--r-xs);text-align:left;font-size:var(--t-body)}
.mi:active:not(:disabled){transform:none}
.mi:hover{background:var(--accent);color:#fff}
.mi:hover small,.mi:hover .g{color:#fff}
.mi.bad{color:var(--bad)}
.mi.bad:hover{background:var(--bad-solid);color:#fff}
.mi .g{color:var(--accent-text);flex:none}
.mi small{display:block;color:var(--ink2);font-size:var(--t-tiny)}
.mi .ck{margin-left:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0}
.sheet{position:absolute;left:50%;top:50%;width:min(380px,calc(100% - 32px));max-height:calc(100% - 40px);overflow-y:auto;background:var(--raised);border-radius:var(--r-l);box-shadow:var(--shadow-3);padding:20px;will-change:transform}
.win[data-size=compact] .sheet{left:0;right:0;top:auto;bottom:0;width:auto;border-radius:30px 30px 46px 46px;padding:10px 16px 30px;max-height:86%;background:var(--canvas)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 14px;display:none}
.win[data-size=compact] .grab{display:block}
.sheet.settings .grab{display:none!important}
.sheet-stack{display:flex;flex-direction:column;gap:14px}
.sheet.settings .sheet-stack{height:100%;gap:0}
.sheet h3{margin:0;font-size:var(--t-head);font-weight:600}
.sheet p{margin:0;font-size:var(--t-note);color:var(--ink2);line-height:1.5}
.sheet .group{box-shadow:none;background:var(--fill)}
.sheet.settings .group{box-shadow:none;background:var(--group);padding:4px 0}
.sheet.settings .row{min-height:44px;padding:6px 14px}
.sheet.settings .row+.row::before{display:none}
.win[data-size=compact] .sheet .group{box-shadow:var(--shadow-1);background:var(--group)}
.url{font:12px/1.4 var(--mono);padding:9px 11px;border-radius:var(--r-s);background:var(--fill);overflow-wrap:anywhere}
.sheet-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.palette{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:min(480px,calc(100% - 24px));max-height:calc(100% - 96px);display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border-radius:var(--r-l);box-shadow:var(--shadow-3),var(--highlight);overflow:hidden;animation:palin .36s var(--ease-smooth) both;z-index:36}
@keyframes palin{from{opacity:0;transform:translateX(-50%) scale(.96)}to{opacity:1;transform:translateX(-50%)}}
.palette input{width:100%;height:50px;background:none;border:0;outline:0;padding:0 18px;font-size:var(--t-title)}
.palette input::placeholder{color:var(--ink3)}
.pal-list{padding:0 6px 6px;overflow-y:auto;min-height:0}
.pal-it{width:100%;display:flex;align-items:center;gap:10px;min-height:36px;padding:5px 12px;border-radius:var(--r-s);text-align:left;font-size:var(--t-body)}
.pal-it:active:not(:disabled){transform:none}
.pal-it .kd{margin-left:auto;font-size:var(--t-note);color:var(--ink2)}
.pal-it .ic{color:var(--ink2)}
.pal-it.sel{background:var(--accent);color:#fff}
.pal-it.sel .kd,.pal-it.sel .ic{color:#fff}
.pal-empty{padding:18px;text-align:center;color:var(--ink2);font-size:var(--t-note)}
.viewer{position:absolute;z-index:25;display:flex;flex-direction:column;background:var(--raised);overflow:hidden;box-shadow:var(--shadow-3)}
.vbar{height:40px;display:flex;align-items:center;gap:7px;padding:0 6px 0 14px;flex:none;min-width:0}
.vbar i{display:none}
.vbar b{font-size:var(--t-note);font-weight:600;white-space:nowrap}
.vbar small{font-size:var(--t-tiny);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.vbody{position:relative;flex:1;min-height:0;overflow:hidden;padding:18px 22px;font-size:var(--t-body);line-height:1.7}
.vbody h4{margin:0 0 8px;font-size:var(--t-title);font-weight:600}
.vbody p{margin:0 0 4px}
.vbody .bars i{display:block;height:9px;border-radius:5px;background:var(--fill2);margin-bottom:11px}
.vbody .bars i:nth-child(3n){width:62%}.vbody .bars i:nth-child(3n+1){width:88%}
.vsnap{transition:filter .5s ease,opacity .5s ease}
.vsnap.snap{filter:blur(7px) saturate(.7);opacity:.72}
.vpaused{position:absolute;inset:0;display:grid;place-items:center;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:var(--t-note);color:var(--ink2);text-align:center;padding:16px}
.flyer{position:absolute;z-index:45;background:var(--raised);border-radius:var(--r-s);box-shadow:var(--shadow-2);overflow:hidden;pointer-events:none;padding:8px;display:flex;flex-direction:column;gap:4px;transform-origin:top left}
.flyer i{display:block;height:6px;border-radius:3px;background:var(--fill2)}
.flyer i:first-child{background:var(--ink3);width:50%}

/* 托盘面板：一块玻璃，几块模块 */
.tray{position:absolute;right:10px;top:32px;width:340px;max-width:calc(100% - 20px);max-height:calc(100% - 44px);overflow-y:auto;overflow-x:hidden;border-radius:24px;background:var(--panel);backdrop-filter:blur(44px) saturate(1.9);-webkit-backdrop-filter:blur(44px) saturate(1.9);box-shadow:var(--shadow-3),var(--highlight);z-index:60;animation:trayin .5s var(--ease-smooth) both;transform-origin:calc(100% - 60px) 0}
@keyframes trayin{from{opacity:0;transform:scale(.9) translateY(-10px)}to{opacity:1;transform:none}}
.tray-in{padding:10px;display:flex;flex-direction:column;gap:8px}
.tray-in>.exp{margin-top:-8px}
.tray-in>.exp>div>.mod{margin-top:8px}
.tray-h{display:flex;align-items:center;gap:2px}
.tray-h .sp{flex:1}
.mod{border-radius:var(--r-l);background:var(--control);box-shadow:var(--highlight),0 .5px 1px rgba(0,0,0,.05);padding:10px}
.tr-send{transition:box-shadow .2s}
.tr-send.holding{box-shadow:0 0 0 2px var(--accent)}
.tr-what{display:flex;align-items:center;gap:8px;min-width:0;font-size:var(--t-note);padding:0 2px 8px;color:var(--ink2)}
.tr-what .tx{flex:1;min-width:0}
.tr-what b{display:block;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.tr-what .iconbtn{width:28px;height:28px}
.tr-targets{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}
.tr-t{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px 5px;border-radius:var(--r-m);font-size:var(--t-tiny);min-width:0}
.tr-t:hover,.tr-t.over{background:var(--fill)}
.tr-t.over{box-shadow:inset 0 0 0 2px var(--accent)}
.tr-t span{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tr-t.flash::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--accent);opacity:0;animation:flash .8s ease-out}
.tr-mo{display:flex;align-items:center;gap:9px;font-size:var(--t-note)}
.tr-mo .tx{flex:1;min-width:0}
.tr-mo b{display:block;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-mo small{display:block;font-size:var(--t-tiny);color:var(--ink2);line-height:1.3;font-variant-numeric:tabular-nums}
.tr-acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.tr-mods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tr-mod{display:flex;gap:8px;align-items:center;min-height:54px;text-align:left;min-width:0;padding:8px}
.tr-mod .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink);flex:none;transition:background-color .2s,color .2s}
.tr-mod.on .ic{background:var(--accent);color:#fff}
.tr-mod .tx{min-width:0;flex:1}
.tr-mod b{display:block;font-size:var(--t-note);font-weight:600;line-height:1.3}
.tr-mod small{display:block;font-size:var(--t-tiny);color:var(--ink2);line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tr-row{display:flex;align-items:center;gap:8px;min-height:34px;font-size:var(--t-note)}
.tr-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-row .sub{color:var(--ink2)}
.minimap{display:block;width:100%;height:96px;margin-bottom:4px}
.tr-clips{padding:6px}
.tr-none{display:flex;align-items:center;gap:10px;padding-top:8px;color:var(--ink2)}
.tr-cl{display:flex;align-items:center;gap:9px;width:100%;min-height:40px;padding:5px 8px;border-radius:var(--r-s);text-align:left;font-size:var(--t-note)}
.tr-cl:hover{background:var(--fill)}
.tr-cl .tx{flex:1;min-width:0}
.tr-cl b{display:block;font-weight:400;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-cl small{display:block;font-size:var(--t-tiny);color:var(--ink2);line-height:1.3}
.tr-cl .cp{width:24px;height:24px;display:grid;place-items:center;color:var(--ink2);border-radius:50%;flex:none;transition:color .15s,background-color .15s}
.tr-cl .cp.done{color:var(--accent-text)}
.tr-cl .pic{width:26px;height:26px;border-radius:var(--r-xs);background:linear-gradient(135deg,#3e63dd,#6e56cf);flex:none}
.tr-label{font-size:var(--t-tiny);font-weight:500;color:var(--ink2);padding:0 2px 6px}

/* ---------- 平台 ---------- */
@font-face{font-family:"Whisper Noto SC";src:url("../../assets/fonts/NotoSansSC-Compact.ttf") format("truetype");font-weight:100 900;font-display:swap}
.menubar{position:relative}
.sys-start,.sys-center{display:flex;align-items:center;gap:4px}
.sys-center{position:absolute;left:50%;top:0;bottom:0;transform:translateX(-50%)}
.sys-tray{display:flex;align-items:center;gap:12px;margin-left:auto}
.sys-extra{display:flex;align-items:center;gap:8px}
.sys-clock{white-space:nowrap}
.sys-app{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r-xs)}
.sys-app:hover{background:var(--fill)}
.sys-app[data-on=true]::after{content:"";position:absolute;left:50%;bottom:2px;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:var(--accent)}
.sys-app[data-on=false]::after{content:"";position:absolute;left:50%;bottom:2px;width:5px;height:3px;margin-left:-2.5px;border-radius:2px;background:var(--ink3)}
.sys-glyph{width:24px;height:24px;display:grid;place-items:center}
.app-ico{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#3e63dd,#6e56cf);display:grid;place-items:center}
.app-ico i{width:12px;height:12px;border:2.5px solid #fff;border-radius:50%}
.win-logo{display:grid;grid-template-columns:9px 9px;gap:1.5px}
.win-logo i{width:9px;height:9px;border-radius:1.5px;background:linear-gradient(135deg,#55c5f7,#0a7fd9)}
.stage[data-os=win],.stage[data-os=kde]{padding:18px 26px 66px}
.stage[data-os=win] .menubar,.stage[data-os=kde] .menubar{position:absolute;left:0;right:0;bottom:0;margin:0;height:48px;padding:0 12px;font-weight:400;background:var(--menubar);backdrop-filter:blur(60px) saturate(1.6);-webkit-backdrop-filter:blur(60px) saturate(1.6);box-shadow:inset 0 .5px 0 var(--sep)}
.stage[data-os=win] .tray-btn,.stage[data-os=kde] .tray-btn{height:32px;width:32px}
.stage[data-os=win] .tray-dot,.stage[data-os=kde] .tray-dot{right:7px;top:8px}
.stage[data-os=win] .sys-clock{text-align:right;line-height:1.3;font-size:11px}
.stage[data-os=kde] .menubar{height:44px;padding:0 8px}
.stage[data-os=kde]{padding-bottom:62px}
.stage[data-os=kde] .sys-clock{text-align:center;line-height:1.25;font-size:11px}
.stage[data-os=gnome] .menubar{height:28px;font-weight:600;color:#fff;background:rgba(18,18,20,.92);backdrop-filter:none;-webkit-backdrop-filter:none}
.stage[data-os=gnome] .tray-btn{color:#fff}
.stage[data-os=gnome] .tray-btn:hover,.stage[data-os=gnome] .tray-btn[aria-expanded=true]{background:rgba(255,255,255,.2)}
.stage[data-os=gnome] .sys-start{padding-left:4px}
.stage[data-max=true]{padding:0!important}
.stage[data-max=true] .menubar{margin:0}
.stage[data-max=true][data-os=mac] .menubar,.stage[data-max=true][data-os=gnome] .menubar{margin:0 0 0}
.stage[data-max=true][data-os=win]{padding-bottom:48px!important}
.stage[data-max=true][data-os=kde]{padding-bottom:44px!important}
.stage[data-max=true] .win{border-radius:0!important;box-shadow:none}
.win.gone{opacity:0;transform:scale(.92) translateY(18px);pointer-events:none}
.win{transition:opacity .22s,transform var(--dur-smooth) var(--ease-smooth),border-radius .12s}
.win[data-size=compact]{transition:none}
.stage .restore{position:absolute;left:50%;top:45%;transform:translateX(-50%);background:var(--raised);box-shadow:var(--shadow-2);z-index:2}
/* 窗口按钮：画在窗口最上层，不被遮罩盖住 */
.caption{position:absolute;top:0;display:none;z-index:45}
.caption.left{left:0}
.caption.right{right:0}
.caption button{display:grid;place-items:center;color:var(--ink);-webkit-tap-highlight-color:transparent}
.caption button:active:not(:disabled){transform:none}
/* Windows：46×32，贴着窗口右上角 */
.win[data-os=win] .caption.right{display:flex;border-top-right-radius:8px;overflow:hidden}
.win[data-os=win] .caption button{width:46px;height:32px;transition:background-color .1s,color .1s}
.win[data-os=win] .caption button:hover{background:var(--fill)}
.win[data-os=win] .caption button:active{background:var(--fill2)}
.win[data-os=win] .caption button.close:hover{background:#c42b1c;color:#fff}
.win[data-os=win] .caption button.close:active{background:#b02a1c;color:#fff}
/* GNOME：24 的灰底圆，和工具栏同一条中线 */
.win[data-os=linux] .caption{padding:10px 8px 0}
/* 看起来 24，命中区更大：GNOME 32（圆之间隔 8），KDE 28（圆之间隔 4） */
.win[data-os=linux] .caption button{position:relative;width:32px;height:32px}
.win[data-os=linux] .caption button::before{content:"";position:absolute;inset:4px;border-radius:50%;transition:background-color .12s}
.win[data-os=linux] .caption button svg{position:relative}
.win[data-os=linux] .caption.has{display:flex}
.win[data-os=linux][data-de=gnome] .caption button::before{background:var(--fill)}
.win[data-os=linux][data-de=gnome] .caption button:hover::before{background:var(--fill2)}
.win[data-os=linux][data-de=gnome] .caption button:active::before{background:var(--ink3)}
/* KDE：没有底，悬停才有圆；关闭悬停是红圆 */
.win[data-os=linux][data-de=kde] .caption{padding:12px 10px 0}
.win[data-os=linux][data-de=kde] .caption button{width:28px;height:28px}
.win[data-os=linux][data-de=kde] .caption button::before{inset:2px}
.win[data-os=linux][data-de=kde] .caption button:hover::before{background:var(--fill2)}
.win[data-os=linux][data-de=kde] .caption button.close:hover{color:#fff}
.win[data-os=linux][data-de=kde] .caption button.close:hover::before{background:#da4453}
/* 窗口形状和字体 */
.stage[data-os=win]{font-family:"Whisper Noto SC","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif}
.stage[data-os=gnome]{font-family:Cantarell,"Noto Sans CJK SC","Whisper Noto SC",sans-serif}
.stage[data-os=kde]{font-family:"Noto Sans","Noto Sans CJK SC","Whisper Noto SC",sans-serif}
.win[data-os=win]{border-radius:8px}
.win[data-os=linux]{border-radius:8px}
.win[data-os=linux][data-de=kde]{border-radius:6px}
/* 侧栏材质 */
.win[data-os=win] .side{background:var(--mica);backdrop-filter:blur(70px) saturate(1.2);-webkit-backdrop-filter:blur(70px) saturate(1.2)}
.win[data-os=linux] .side{background:var(--sidebar-solid);backdrop-filter:none;-webkit-backdrop-filter:none}
.win[data-os=win] .lights,.win[data-os=linux] .lights{display:none}
.win[data-os=win] .side-top,.win[data-os=linux] .side-top{margin-top:0;padding:10px 10px 4px 20px;min-height:42px}
.brand{display:none;flex:1;min-width:0;font-size:var(--t-note);font-weight:500;color:var(--ink2)}
.win[data-os=win] .brand,.win[data-os=linux] .brand{display:block}
.win[data-os=linux][data-left=true] .brand{display:none}
/* 工具栏给窗口按钮留位，设备卡片和浮层也让开 */
.tb{padding-right:calc(12px + var(--cap-r,0px))}
.win[data-size=compact] .tb{padding-right:4px}
.win[data-os=win]{--float-top:40px;--sheet-gap:96px}
.win[data-os=linux]{--float-top:44px;--sheet-gap:104px}
.win[data-os=linux][data-left=true]{--float-top:10px;--sheet-gap:96px}
/* 设备卡片的高度跟着内容走，放不下才在卡片里滚动。常规尺寸盖在内容上，宽屏把内容推开 */
.win:not([data-size=compact]) .insp{position:absolute;right:10px;top:calc(var(--status,0px) + var(--float-top,10px));bottom:auto;width:var(--card-w);max-height:calc(100% - var(--status,0px) - var(--float-top,10px) - 10px);display:flex;flex-direction:column;border-radius:var(--r-l);box-shadow:var(--shadow-2);z-index:6;touch-action:pan-y}
.win:not([data-size=compact]) .insp-in{flex:0 1 auto;min-height:0;height:auto;box-shadow:none}
.insp-x{position:absolute;right:8px;top:8px;z-index:1}
.win[data-input=touch] .insp-x{right:2px;top:2px;width:48px;height:48px}
.win[data-size=compact] .insp-x{display:none}
.sheet{max-height:calc(100% - var(--sheet-gap,96px))}
.sheet.settings{height:min(560px,calc(100% - var(--sheet-gap,96px)))}
.sheet.settings .lockrow{min-height:58px}
.lockrow .tx{flex:1;min-width:0}
.lockrow .tx small{white-space:normal;overflow:visible}
.lockrow .sp{display:none}
.lockrow .val{margin:0 8px;flex:none;white-space:nowrap}
/* 托盘：Windows 和 KDE 的任务栏在下面，面板向上长 */
.stage[data-os=win] .tray{top:auto;bottom:58px;right:12px;transform-origin:calc(100% - 60px) 100%;max-height:calc(100% - 74px);animation-name:trayup}
@keyframes trayup{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
/* 原生菜单：不是玻璃，是系统自己画的 */
.nmenu{position:absolute;z-index:60;min-width:220px;padding:5px;background:var(--raised);border-radius:8px;box-shadow:var(--shadow-2);font-size:13px;color:var(--ink)}
.stage[data-os=gnome]>.nmenu{right:8px;top:32px}
.stage[data-os=kde]>.nmenu{right:8px;bottom:50px}
.stage[data-os=win]>.nmenu{right:12px;bottom:58px}
.stage[data-os=mac]>.nmenu{right:10px;top:30px}
.nm-i{position:relative;width:100%;min-height:28px;display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:5px;text-align:left}
.nm-i:active:not(:disabled){filter:none}
.nm-i:hover:not(:disabled),.nm-w[data-open=true]>.nm-i{background:var(--fill2)}
.nm-i:disabled{color:var(--ink2)}
.nm-i .ck{width:14px;flex:none;display:grid;place-items:center}
.nm-i .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.nm-i .ar{color:var(--ink2);flex:none}
.nm-sep{height:1px;margin:4px 6px;background:var(--sep)}
.nm-w{position:relative}
.nm-w>.nmenu{display:none;right:calc(100% + 2px);top:-5px}
.nm-w[data-open=true]>.nmenu{display:block}
.stage[data-os=kde] .nmenu,.stage[data-os=kde] .nm-i{border-radius:4px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .eq i,.wave.live i{transform:scaleY(.7)}
}
@media (max-width:520px){
  .stage{padding-inline:10px;border-radius:var(--r-m)}
  .stage[data-frame=phone] .win{height:720px}
  .menubar{margin-inline:-10px}
}
</style>
</head>
<body>
<div class="wrap">

<div id="try">
  <div class="try" aria-label="平板和折叠屏" id="formRow">
    <span>平板和折叠屏</span>
    <button class="chip" data-form="ipad" aria-pressed="false">iPad</button>
    <button class="chip" data-form="fold" aria-pressed="false">iPhone 折叠</button>
    <button class="chip" data-form="wide" aria-pressed="false">阔折叠</button>
    <button class="chip" data-form="tri" aria-pressed="false">三折叠</button>
    <i id="formSep" hidden></i>
    <span id="formStates" style="display:contents;color:inherit"></span>
    <span class="form-dim" id="formDim"></span>
  </div>
  <div class="try" aria-label="平台" data-desk>
    <span>平台</span>
    <button class="chip" data-os="mac" aria-pressed="true">macOS</button>
    <button class="chip" data-os="win" aria-pressed="false">Windows</button>
    <button class="chip" data-os="gnome" aria-pressed="false">GNOME</button>
    <button class="chip" data-os="kde" aria-pressed="false">KDE</button>
    <button class="chip" data-demo="btnLeft" id="btnLeft" aria-pressed="false" hidden>窗口按钮在左</button>
  </div>
  <div class="try" aria-label="试试">
    <span>试试</span>
    <button class="chip" data-desk data-demo="audio">把声音放到两台</button>
    <button class="chip" data-desk data-demo="input">排列键鼠</button>
    <button class="chip" data-desk data-demo="push">把指针推过去</button>
    <button class="chip" data-desk data-demo="tray" id="trayChip">把文件拖到托盘</button>
    <button class="chip" data-demo="open">打开 iMac 的备忘录</button>
    <button class="chip" data-demo="send">把窗口送到 iMac</button>
    <button class="chip" data-demo="req">iMac 请求看文件</button>

  if (!e.buttons) { endDrag(); return; }
  if (!kbD.moved && Math.hypot(e.clientX-kbD.sx,e.clientY-kbD.sy)<4) return;
  const n=KBM.nodes[kbD.id];
  if (!kbD.moved) {
    kbD.moved=true;
    if (kbD.bench) { const m=kbModel(e); kbD.dx=n.w/2; kbD.dy=n.h/2; n.placed=true; kp(kbD.id).x.jump(m.x-kbD.dx); kp(kbD.id).y.jump(m.y-kbD.dy); kbDrawCanvas(); }
    $(`.scr[data-node="${kbD.id}"]`)?.classList.add('drag');
    const g=document.createElement('i'); g.className='kb-ghost'; $('.kb-canvas').appendChild(g);
  }
  const m=kbModel(e), x=m.x-kbD.dx, y=m.y-kbD.dy; kp(kbD.id).x.jump(x); kp(kbD.id).y.jump(y);
  kbD.inside=m.inside; kbD.snap=m.inside?kbSnap(kbD.id,x,y):null;
  const gh=$('.kb-ghost'); if (gh) gh.hidden=!kbD.snap;
  kbPaint();
});
document.addEventListener('pointerup', () => endDrag());

function endDrag() {
  if (!kbD) return;
  const d=kbD; kbD=null; const n=KBM.nodes[d.id];
  if (!d.moved) { if (d.bench) kbAdd(d.id); else { KBM.sel=KBM.sel===d.id?null:d.id; renderAll(); } return; }
  $('.kb-ghost')?.remove();
  if (d.inside && d.snap) {
    n.x=d.snap.x; n.y=d.snap.y; kp(d.id).x.to(n.x,M.snappy); kp(d.id).y.to(n.y,M.snappy);
    KBM.sel=d.id; if (d.bench && KBM.on) kbConnect(d.id);

function statusOf(id) {
  const d = DEV[id];

  if (d.state==='seen') return {t:'在附近'};
  if (d.state==='connecting') return {t:'正在连接…'};
  if (d.state==='off') return {t:`离线 · ${d.seen}`};
  const tr = acts.find(a => a.dev===id && a.kind==='transfer' && a.p<1);
  if (tr) return {t:`${esc(tr.title)} <span data-pct="${tr.id}">${Math.round(tr.p*100)}%</span>`,live:1};
  if (AUD.mode==='sink'&&AUD.source===id) return {t:'声音放到这台',live:1};
  if (KBM.role==='controlled'&&KBM.controller===id) return {t:'正在控制这台',live:1};
  if (KBM.active===id) return {t:'键鼠正在控制它',live:1};
  if (AUD.on&&AUD.members[id]) return {t:`放着这台的声音`,live:1};
  const f = S.flows.filter(x => x.other===id).length;

  let s=LIQ[sel];

function qrSvg(seed) {
  let h=0; for (const c of seed) h=(h*31+c.charCodeAt(0))>>>0;
  const N=21, on=() => { h=(h*1664525+1013904223)>>>0; return (h>>>16)&1; };
  const finder=(x,y) => (x<7&&y<7)||(x>=N-7&&y<7)||(x<7&&y>=N-7);
  const f=(x,y,ox,oy) => { const a=x-ox,b=y-oy; return a===0||a===6||b===0||b===6||(a>=2&&a<=4&&b>=2&&b<=4); };
  let r='';
  for (let y=0;y<N;y++) for (let x=0;x<N;x++) {
    let v; if (finder(x,y)) v = x<7&&y<7?f(x,y,0,0):x>=N-7?f(x,y,N-7,0):f(x,y,0,N-7); else v=on();
    if (v) r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  }
  return `<svg class="qr" viewBox="0 0 21 21" fill="currentColor" role="img" aria-label="二维码（示意）">${r}</svg>`;
}

    $$(`[data-pct="${a.id}"]`).forEach(e => e.textContent = Math.round(a.p*100)+'%');
    $$(`[data-bar="${a.id}"]`).forEach(e => e.style.width = (a.p*100)+'%');
    $$(`[data-ring="${a.id}"]`).forEach(e => e.setAttribute('stroke-dasharray', `${(a.p*100).toFixed(1)} 100`));
  });
