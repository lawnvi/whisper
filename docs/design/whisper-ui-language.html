let palSel=0, palItems=[];
function buildPal() {
  const it=[];
  Object.values(DEV).forEach(d => { it.push({label:d.name,kd:'设备',icon:'info',run:() => selectDev(d.id)}); });
  Object.values(DEV).filter(d => d.state==='on').forEach(d => {
    APPS[d.kind].forEach(a => it.push({label:`${a[0]}（${d.name}）`,kd:'应用',icon:'apps',run:() => { selectDev(d.id); setPlace('apps'); requestAnimationFrame(() => { const e=$(`[data-app="${CSS.escape(a[0])}"]`); e&&openWindow(a[0],e); }); }}));
    it.push({label:`把这台的声音放到 ${d.name}`,kd:'声音',icon:'speaker',run:() => audAdd(d.id)});
    if (d.kind!=='phone') it.push({label:`用这台的键鼠控制 ${d.name}`,kd:'键鼠',icon:'keyboard',run:() => { if (!KBM.nodes[d.id].placed) kbAdd(d.id); if (!KBM.on) kbSetOn(true); }});
  });
  FILES.root.filter(f => f[1]==='file').forEach(f => it.push({label:f[0],kd:'iMac 的文件',icon:'doc',run:() => { selectDev('imac'); setPlace('files'); }}));
  it.push({label:'共享链接',kd:'共享',icon:'link',run:() => goGlobal('links')});
  it.push({label:'声音',kd:'共享',icon:'speaker',run:() => goGlobal('audio')});
  it.push({label:'键鼠',kd:'共享',icon:'keyboard',run:() => goGlobal('input')});
  it.push({label:'设置',kd:'这台',icon:'gear',run:() => A.settings()});
  return it;
}
function openPalette() {
  closePalette(); closeMenus();
  const p=document.createElement('div'); p.className='palette'; p.id='palette'; p.setAttribute('role','dialog'); p.setAttribute('aria-label','搜索');
  p.innerHTML='<input id="palInput" autocomplete="off" placeholder="搜索" aria-label="搜索设备、文件、应用，或者想做的事"><div class="pal-list" id="palList"></div>';
  overlay.appendChild(p);
  const inp=$('#palInput');
  const all=buildPal();
  const draw=() => {
    const q=inp.value.trim().toLowerCase();
    palItems=(q?all.filter(i => i.label.toLowerCase().includes(q)||i.kd.includes(q)):all).slice(0,8);
    palSel=Math.min(palSel,Math.max(0,palItems.length-1));
    $('#palList').innerHTML=palItems.map((i,n) => `<button class="pal-it ${n===palSel?'sel':''}" data-a="palRun" data-v="${n}"><span class="ic">${ic(i.icon,15)}</span><span>${esc(i.label)}</span><span class="kd">${esc(i.kd)}</span></button>`).join('')||'<div class="pal-empty">没有找到</div>';
  };
  inp.addEventListener('input',() => { palSel=0; draw(); });
  inp.addEventListener('keydown',e => {
    if (e.key==='ArrowDown'){palSel=Math.min(palItems.length-1,palSel+1);draw();e.preventDefault();}
    else if (e.key==='ArrowUp'){palSel=Math.max(0,palSel-1);draw();e.preventDefault();}
    else if (e.key==='Enter'){runPal(palSel);}
    else if (e.key==='Escape'){closePalette();}
  });
  draw(); inp.focus({preventScroll:true});
}
function closePalette() { $('#palette')?.remove(); }
function runPal(n) { const i=palItems[n]; closePalette(); i&&i.run(); }

  if (!t.closest('.menu') && !t.closest('[data-a=composeAct]') && !t.closest('[data-a=fileLoc]') && !t.closest('[data-a=fileMore]') && !t.closest('.dev') && !t.closest('[data-a=audRolePick]') && !t.closest('[data-a=prefPick]') && !t.closest('[data-a=linkMore]') && !t.closest('[data-a=fileTo]') && !t.closest('[data-a=vSend]')) closeMenus();
  if (!t.closest('#palette') && !t.closest('[data-a=palette]')) closePalette();
  if (islOpen && !t.closest('#island') && !t.closest('[data-demo]') && !reqs.length) { islOpen=false; renderIsland(); }
  /* 点卡片外面就收起，这一下照常生效 */
  /* 用 composedPath：点的东西可能已经被重画，离开了文档 */
  const hit=e.composedPath();
  if (S.insp && S.size!=='compact' && !hit.some(n => n.id==='insp'||n.id==='try'||n.id==='overlay'||n.dataset?.a==='insp')) { S.insp=false; renderInsp(); $('[data-a=insp]')?.setAttribute('aria-pressed',false); }
  if ((S.tray||S.trayMenu) && !t.closest('#trayPanel') && !t.closest('#trayMenu') && !t.closest('#trayBtn') && !t.closest('[data-demo=tray]')) { S.tray=false; S.trayMenu=null; S.nmOpen=null; S.hold=null; renderTray(); }
  if (e.detail===0) { const c=t.closest('.bchip[data-kb]'); if (c&&!c.disabled) kbAdd(c.dataset.kb); }
  const el=t.closest('[data-a]');
  if (el && (win.contains(el)||stage.contains(el)) && !el.disabled) { const f=A[el.dataset.a]; f&&f(e,el); }
});
document.addEventListener('contextmenu', e => {
  const row=e.target.closest?.('.dev[data-dev]'); if (!row) return; e.preventDefault();
  const id=row.dataset.dev, d=DEV[id], go=fn => () => { selectDev(id); fn(); };
  showMenu(row,d.name,[
    d.state==='on'?{label:'断开连接',on:go(() => A.disconnect())}:{label:'连接',on:go(() => A.connect())},
    {label:'设备卡片',on:go(() => { if (S.size==='compact') phoneGo('card'); else { S.insp=true; renderInsp(); } })},
    ...(d.state==='off'?[{label:'移除这台设备',danger:true,on:go(() => A.forget())}]:[]),
  ]);
});
document.addEventListener('submit', e => {
  const lr=e.target.closest('[data-form=linkRoute]');
  if (lr) { e.preventDefault(); const id=lr.dataset.v, r=lr.route.value.trim();
    if (S.shares.some(x => x.route===r&&x.id!==id)) { lr.route.setCustomValidity('已经有链接在用这个路由了'); lr.route.reportValidity(); return; }
    S.shares.find(x => x.id===id).route=r; renderAll(); openSheet('link',() => linkSheet(id)); return; }
  const lp=e.target.closest('[data-form=linkPw]');
  if (lp) { e.preventDefault(); const id=lp.dataset.v; S.shares.find(x => x.id===id).pw=!!lp.pw.value; renderAll(); openSheet('link',() => linkSheet(id)); return; }
  const f=e.target.closest('[data-form=send]'); if (!f) return; e.preventDefault();
  const i=$('#composerInput'), v=i.value.trim(); if (!v&&!S.attach) return;
  if (S.attach) { const id=startTransfer(S.dev,S.attach,`发到 ${DEV[S.dev].name}`,true); MSG[S.dev].push({t:'f',me:1,name:S.attach,size:'2.4 MB',act:id,fresh:1}); S.attach=null; }
  if (v) MSG[S.dev].push({t:'b',me:1,v,fresh:1});
  i.value=''; chatPin=true; renderAll();
  $('#composerInput').focus({preventScroll:true});
});
document.addEventListener('input', e => {
  if (e.target.type==='range') paintRange(e.target);
  if (e.target.id==='composerInput') syncSend();
  if (e.target.dataset?.input==='gain') { AUD.gain=+e.target.value; e.target.parentElement.querySelector('output').textContent=AUD.gain.toFixed(1)+'x'; }
  if (e.target.dataset?.input==='wheel') { S.prefs.wheel=+e.target.value; e.target.parentElement.querySelector('output').textContent=S.prefs.wheel.toFixed(1)+'x'; }
  
});
document.addEventListener('keydown', e => {
  if (S.recKey) {
    e.preventDefault(); e.stopPropagation();
    if (e.key==='Escape') { S.recKey=null; renderAll(); return; }
    if (['Control','Shift','Alt','Meta'].includes(e.key)) return;
    S.prefs[S.recKey]=keyStr([...(e.ctrlKey?['ctrl']:[]),...(e.altKey?['alt']:[]),...(e.shiftKey?['shift']:[]),...(e.metaKey?['meta']:[])],e.key.toUpperCase()); S.recKey=null; renderAll(); return;
  }
  if ((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k') { e.preventDefault(); openPalette(); }
  if ((e.metaKey||e.ctrlKey)&&e.key===',') { e.preventDefault(); A.settings(); }
  if (e.key==='Escape') { closeMenus(); closePalette(); closeSheet(); if (S.insp&&S.size!=='compact'){S.insp=false;renderInsp();} if (islOpen&&!reqs.length){islOpen=false;renderIsland();} S.tray=false; S.hold=null; renderTray(); }
  const s=e.target.closest?.('.scr[data-node]');
  if (s) {
    const id=s.dataset.node;
    if (e.key==='Enter'||e.key===' ') { e.preventDefault(); KBM.sel=KBM.sel===id?null:id; renderAll(); return; }
    const dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
    if (dir&&id!=='self') { e.preventDefault(); const n=KBM.nodes[id], st=e.shiftKey?400:100, p=kbSnap(id,n.x+dir[0]*st,n.y+dir[1]*st); n.x=p.x; n.y=p.y; kp(id).x.to(n.x); kp(id).y.to(n.y); kbReattach(); renderAll(); kbFit(true); }
  }
});
function commitField(i) {
  const k=i.dataset.k, v=i.value.trim();
  if (k==='port' && !(/^\d+$/.test(v) && +v>=1 && +v<=65535)) { i.value=S.prefs.port; note('端口范围为 1–65535','已恢复原来的端口'); return; }
  if (k==='name' && !v) { i.value=S.prefs.name||selfName(); return; }
  if (S.prefs[k]!==v) { S.prefs[k]=v; renderAll(); }
}
document.addEventListener('focusout', e => { if (e.target.dataset?.input==='pref') commitField(e.target); });
document.addEventListener('keydown', e => {
  if (e.target.dataset?.input!=='pref') return;
  if (e.key==='Enter') { commitField(e.target); e.target.blur(); }
  if (e.key==='Escape') { e.stopPropagation(); e.target.value=e.target.dataset.k==='port'?S.prefs.port:(S.prefs.name||selfName()); e.target.blur(); }
}, true);
document.addEventListener('scroll', e => {
  const t=e.target; if (t.classList && t.classList.contains('scroll')) $('#main').classList.toggle('scrolled', t.scrollTop>2);
  /* 文件卡片滚出屏幕后，岛回来说它的进度 */
  if (t.classList && t.classList.contains('chat-scroll')) renderIsland();
}, true);
$('#trayBtn').addEventListener('click',() => { S.trayMenu=null; S.nmOpen=null; S.tray=!S.tray; if (!S.tray) S.hold=null; renderTray(); });
$('#trayBtn').addEventListener('contextmenu',e => { e.preventDefault(); S.tray=false; S.nmOpen=null; S.trayMenu=isLinux()?'linux':'basic'; renderTray(); });
stage.addEventListener('dblclick',e => { const t=e.target; if (S.size==='compact'||isMac()&&false) return; if ((t.closest('.tb')||t.closest('.side-top'))&&!t.closest('button,input,[role=switch],.seg')) toggleMax(); });

/* 真实拖放 */
stage.addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types||[])].includes('Files') && e.target.closest?.(isMac()?'#trayBtn,#trayPanel':'#trayPanel')) { if (!S.tray) { S.tray=true; renderTray(); } e.preventDefault(); } });
stage.addEventListener('dragover', e => {
  if (![...(e.dataTransfer?.types||[])].includes('Files')) return;
  e.preventDefault(); e.dataTransfer.dropEffect='copy';
  $$('.tr-t.over').forEach(x => x.classList.remove('over'));
  e.target.closest?.('.tr-t')?.classList.add('over');
  $('#trSend')?.classList.toggle('holding', !!e.target.closest?.('#trayPanel'));
});
stage.addEventListener('drop', e => {
  e.preventDefault(); $$('.tr-t.over').forEach(x => x.classList.remove('over'));
  const files=[...(e.dataTransfer?.files||[])], t=e.target.closest?.('.tr-t');
  if (!files.length) return;
  const fmt=n => n>1e6?`${(n/1e6).toFixed(1)} MB`:`${Math.ceil(n/1e3)} KB`;
  if (t) files.forEach(f => traySendTo(t.dataset.v,{kind:'file',name:f.name,size:fmt(f.size)}));
  else if (e.target.closest?.('#trayPanel')) { S.hold={kind:'file',name:files[0].name,size:fmt(files[0].size)}; renderTray(); }
});

/* ---------- 引导按钮 ---------- */
function ensureDetail() { if (S.size==='compact'&&S.nav!=='detail'){S.nav='detail';push.to(1);} }
function syncChips() {
  $('[data-demo=inAudio]')?.setAttribute('aria-pressed',AUD.mode==='sink');
  $('[data-demo=inInput]')?.setAttribute('aria-pressed',KBM.role==='controlled');
  $('[data-demo=lost]')?.setAttribute('aria-pressed',!S.selfOk);
  $('[data-demo=drop]')?.setAttribute('aria-pressed',DEV.imac?.state!=='on');
}
$('#try').addEventListener('click', e => {
  const fo=e.target.closest('[data-form]');
  if (fo) { const k=fo.dataset.form; if (S.form===k) { S.form=null; S.frame='desktop'; } else { S.form=k; S.frame='form'; S.formState=FORMS[k].start||0; $('#phoneChip').setAttribute('aria-pressed','false'); } syncForm(); measure(true); return; }
  const fs=e.target.closest('[data-fstate]');
  if (fs) { S.formState=+fs.dataset.fstate; syncForm(); measure(true); return; }
  const o=e.target.closest('[data-os].chip'); if (o) { setOs(o.dataset.os); return; }
  const b=e.target.closest('[data-demo]'); if (!b) return;
  const k=b.dataset.demo;
  if (k==='phone') { S.frame = S.frame==='phone'?'desktop':'phone'; S.form=null; b.setAttribute('aria-pressed',S.frame==='phone'); syncForm(); measure(true); return; }
  if (k==='dark') { setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); return; }
  if (viewer) closeViewer(true);
  if (k==='lost') { S.selfOk=!S.selfOk; syncChips(); renderAll(); return; }
  if (k==='drop') { const d=DEV.imac; d.state=d.state==='on'?'off':'on'; d.seen='刚刚'; syncChips(); renderAll(); return; }
  if (k==='btnLeft') { S.layout=S.layout.startsWith('close')?':minimize,maximize,close':'close,minimize,maximize:'; renderAll(); return; }
  if (k==='tray') {
    if (S.size==='compact') { note('手机没有托盘','桌面才有这块面板'); return; }
    if (isLinux()) { S.tray=true; renderTray(); return; }
    S.tray=true; S.hold={kind:'file',name:'周报.pdf',size:'1.8 MB'}; renderTray(); return;
  }
  if (k==='audio') {
    goGlobal('audio');
    if (AUD.mode==='sink') A.sinkStop();
    if (S.size==='compact') return;
    if (!AUD.members.imac) setTimeout(() => audAdd('imac'),320);
    if (!AUD.members.mi) setTimeout(() => audAdd('mi'),900);
    return;
  }
  if (k==='input') { goGlobal('input'); if (KBM.role==='controlled') A.ctrlStop(); if (S.size!=='compact'&&!KBM.nodes.tp.placed) setTimeout(() => kbAdd('tp'),360); return; }
  if (k==='push') {
    goGlobal('input'); if (KBM.role==='controlled') A.ctrlStop();
    if (S.size==='compact') return;
    const go=() => { const to=KBM.active==='imac'?'self':'imac'; if (to==='self') { A.kbBack(); return; } KBM.st.imac='connected'; ptr.to('imac',() => { KBM.active='imac'; renderAll(); }); };
    if (!KBM.on) { kbSetOn(true); setTimeout(go,900); } else go();
    return;
  }
  if (k==='inAudio') {
    if (AUD.mode==='sink') { A.sinkStop(); return; }
    AUD.on=false; AUD.st={}; AUD.mode='sink'; AUD.source='imac'; AUD.paused=false; syncChips(); if (S.size==='compact') renderAll(); else goGlobal('audio'); return;
  }
  if (k==='inInput') {
    if (KBM.role==='controlled') { A.ctrlStop(); return; }
    if (KBM.on) kbSetOn(false);
    KBM.role='controlled'; KBM.controller='imac'; syncChips(); goGlobal('input'); return;
  }
  if (S.size==='compact') { S.pstack=[]; S.dev='imac'; S.place='chat'; S.nav='detail'; push.to(1); S.sel=null; S.path=[]; }
  else if (isGlobal()||DEV[S.dev]?.state!=='on'||S.dev!=='imac') { S.dev='imac'; S.place='chat'; S.sel=null; S.path=[]; }
  ensureDetail();
  if (k==='req') { const id='r'+(uid++); reqs.push({id,dev:'imac',title:'iMac 请求访问你的文件',sub:''}); islOpen=true; renderAll(); }
  if (k==='open'||k==='send') {
    setPlace('apps'); renderAll();
    requestAnimationFrame(() => {
      if (k==='open') { const el=$('[data-app="备忘录"]'); el&&openWindow('备忘录',el); }
      else { const el=$('[data-a=sendWin]'); if (el) sendWindow(el.dataset.v,el,'imac'); else note('这台的窗口都送出去了','先拿回来一个再试'); }
    });
  }
});

/* ---------- 平板和折叠屏：逻辑尺寸，折痕位置 ----------
   宽高是估算，用来试布局，不用来写判断。产品里只看窗口的宽和高 */
const FORMS = {
  ipad:{ r:20, start:0, states:[
    {l:'竖着',w:820,h:1180}, {l:'横着',w:1180,h:820}, {l:'分屏',w:405,h:820,dev:820} ]},
  fold:{ r:30, start:1, states:[
    {l:'合上',w:474,h:696}, {l:'打开',w:904,h:640,cv:[.5]}, {l:'半开·书本',w:904,h:640,cv:[.5],posture:'book'}, {l:'半开·桌面',w:640,h:904,cx:[.5],posture:'table'} ]},
  wide:{ r:26, start:1, states:[
    {l:'合上',w:487,h:712}, {l:'打开',w:1006,h:711,cv:[.5]}, {l:'小阔折叠·竖',w:533,h:857,cx:[.5]}, {l:'小阔折叠·横',w:857,h:533,cv:[.5]} ]},
  tri:{ r:24, start:2, states:[
    {l:'一屏',w:422,h:937}, {l:'两屏',w:860,h:937,cv:[.5]}, {l:'三屏',w:1337,h:937,cv:[1/3,2/3]} ]},
};
const formNow = () => S.form&&FORMS[S.form].states[S.formState];
const formW = new Spring(0,M.smooth,() => paintForm(),.2), formH = new Spring(0,M.smooth,() => paintForm(),.2);
function paintForm() {
  if (S.frame!=='form') return;
  const f=formNow(); if (!f) return;
  const fr=$('#devFrame');
  fr.style.width=formW.x+'px'; fr.style.height=formH.x+'px';
  win.style.width=(f.dev?formW.x*f.w/f.dev-4:formW.x)+'px'; win.style.height=formH.x+'px';
  if (S.place==='input') kbFit(false);
  placeIsland();
}
function syncForm() {
  $$('#try [data-form]').forEach(b => b.setAttribute('aria-pressed',b.dataset.form===S.form));
  const f=formNow(), fr=$('#devFrame'), cr=$('#creases');
  $('#formSep').hidden=!f;
  $('#formStates').innerHTML=f?FORMS[S.form].states.map((x,i) => `<button class="chip" data-fstate="${i}" aria-pressed="${i===S.formState}">${x.l}</button>`).join(''):'';
  $('#formDim').textContent=f?`${f.w} × ${f.h}`:'';
  if (!f) { fr.removeAttribute('style'); win.style.width=''; win.style.height=''; delete win.dataset.posture; delete win.dataset.short; cr.innerHTML=''; cr.className='creases'; S.zoom=1; return; }
  const hv=f.cv||[], hz=f.cx||[];
  cr.className='creases'+(f.posture?' half':'');
  cr.innerHTML=[...hv.map(p => `<i class="v" style="left:${p*100}%"></i>`),...hz.map(p => `<i class="h" style="top:${p*100}%"></i>`)].join('');
  fr.dataset.split=f.dev?'true':'false';
  fr.style.setProperty('--form-r',FORMS[S.form].r+'px');
  if (f.posture) win.dataset.posture=f.posture; else delete win.dataset.posture;
  const H=f.h;
  win.dataset.short=H<600?'true':'false';
  win.style.setProperty('--hx',(hv[0]||0)*(f.w)+'px');
  win.style.setProperty('--hy',(hz[0]||0)*H+'px');
}
let chatPinUntil=0;
function measure(force) {
  const narrow = stage.parentElement.clientWidth < 640;
  const chip = $('#phoneChip'); chip.hidden = narrow;
  $('#formRow').hidden = narrow;
  const f = !narrow&&S.frame==='form' ? formNow() : null;
  const frameWas = stage.dataset.frame;
  $$('[data-desk]').forEach(b => b.hidden = S.frame!=='desktop'||narrow);
  stage.dataset.frame = f?'form':(S.frame==='phone'||narrow)?'phone':'desktop';
  $('.wrap').style.maxWidth = f?'1500px':'';
  if (f) {
    const H=f.h, W0=f.dev||f.w;
    S.zoom=Math.max(.55,Math.min(1,(stage.parentElement.clientWidth-44)/W0,(innerHeight-190)/H));
    $('#devFrame').style.zoom=S.zoom;
    const go=frameWas==='form'&&!reduced;
    if (go) { formW.to(W0); formH.to(H); } else { formW.jump(W0); formH.jump(H); }
  } else { S.zoom=1; const fr=$('#devFrame'); fr.style.zoom=''; fr.style.width=''; fr.style.height=''; win.style.width=''; win.style.height=''; }
  const w = f ? f.w : stage.clientWidth;
  const next = f ? (w<600?'compact':w<1000?'regular':'expanded') : (S.frame==='phone'||narrow) ? 'compact' : w<1000 ? 'regular' : 'expanded';
  win.dataset.input = (f||S.frame==='phone'||narrow)?'touch':'pointer';
  if (next===S.size&&!force) { kbFit(false); return; }
  const changed = next!==S.size;
  const cont = frameWas==='form'&&!!f;
  const was = S.size;
  S.size=next; win.dataset.size=next;
  if (viewer) closeViewer(true);
  if (!cont) closeSheet(true); else if (sheetS) sheetS.cb(sheetS.x);
  closeMenus();
  if (changed&&cont) {
    /* 折叠和展开不丢东西：设备、分页、草稿、滚动位置都留着。
       展开：页面栈摊成侧栏加内容，设备页变成设备卡片。合上：这台设备留在栈顶，返回才回到列表 */
    const sc=$('.place .scroll'); if (sc&&sc.scrollHeight-sc.scrollTop-sc.clientHeight<40) { chatPin=true; chatPinUntil=performance.now()+900; }
    if (next==='compact') {
      if (S.insp&&!isGlobal()) { S.insp=false; S.pstack.push({place:S.place,setNav:S.setNav}); S.place='card'; }
      S.nav='detail';
    } else {
      if (S.place==='card') { const p=S.pstack.pop(); S.place=p?p.place:'chat'; S.insp=true; }
      if (was==='compact'&&S.nav==='list') S.nav='detail';
      S.nav='detail';
      if (was==='compact') { const sd=$('#side'); sd.classList.remove('unfold'); void sd.offsetWidth; sd.classList.add('unfold'); }
    }
    inspP.jump(S.insp&&next!=='compact'&&!isGlobal()?1:0);
    push.jump(S.nav==='list'&&next==='compact'?0:1);
  } else if (changed) {
    S.nav = next==='compact' ? 'list' : 'detail';
    S.pstack=[];
    if (next==='compact' && !['chat','files','apps'].includes(S.place)) { S.deskPlace=S.place; S.place='chat'; }
    if (next!=='compact') { if (PHONE_PAGES.includes(S.place)) S.place='chat'; if (S.deskPlace) { S.place=S.deskPlace; S.deskPlace=null; } }
    inspP.jump(S.insp&&next!=='compact'&&!isGlobal()?1:0);
    push.jump(S.nav==='list'&&next==='compact'?0:1);
    lastKey='';
  }
  renderAll(); paintInsp(inspP.x); paintPush(push.x);
}
new ResizeObserver(() => measure()).observe(stage.parentElement);
/* 外框在走弹簧时，气泡重新收紧，贴底的对话继续贴底 */
new ResizeObserver(() => { if (S.frame!=='form') return; tightBubbles(); if (performance.now()<chatPinUntil) { const sc=$('.chat-scroll'); if (sc) sc.scrollTop=sc.scrollHeight; } }).observe(win);
measure(true);
})();
</script>
