name: 功能建议 / Feature request
description: 想要的新功能或改进 / Something you'd like Whisper to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What are you trying to do
      description: 说说你的场景：有哪些设备，想完成什么事 / Your setup and what you want to get done
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望怎么做 / What you'd like
  - type: dropdown
    id: platforms
    attributes:
      label: 涉及的平台 / Platforms
      multiple: true
      options:
        - Android
        - macOS
        - Windows
        - Linux
        - iOS / iPadOS
