name: English
description: Report a problem or suggest an idea
body:
  - type: textarea
    id: what
    attributes:
      label: Description
      placeholder: What you saw and what you expected, or what you would like added. Screenshots can be dragged in.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Version and devices
      placeholder: 0.0.61, MacBook Air (macOS 15) → Windows 11
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      placeholder: In Whisper, Settings → Diagnostics → Report copies them for you; paste them here. They contain no messages, files or device names.
      render: text
