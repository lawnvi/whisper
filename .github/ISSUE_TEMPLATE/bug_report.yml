# The file keeps its name: older versions of the app open it directly.
# GitHub silently drops a template whose name is shorter than 3 characters.
name: 简体中文
description: 反馈问题，或者提一个建议
body:
  - type: textarea
    id: what
    attributes:
      label: 描述
      placeholder: 看到了什么、本来应该怎样，或者想要什么功能。截图可以直接拖进来。
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 版本和设备
      placeholder: 0.0.61，MacBook Air（macOS 15）→ Windows 11
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息
      placeholder: 在 Whisper 的「设置 → 诊断信息」里点「反馈问题」会自动拷贝，粘贴到这里。不含消息、文件和设备名。
      render: text
