name: release-packages

on:
  push:
    tags:
      - 'dev-v*.*.*'
      - 'release-v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - macos-intel
          - windows
          - linux
          - android
      version:
        description: Version used for a manually rebuilt package (for example 0.0.47)
        required: false
        type: string
      publish:
        description: Publish the rebuilt package to the matching dev release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-version:
    name: Verify release version
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Verify release tag matches pubspec version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          tag_version="${GITHUB_REF_NAME##*-}"
          tag_version="${tag_version#v}"
          pubspec_version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?[[:space:]]*$/\1/p' pubspec.yaml)"

          if [[ -z "$pubspec_version" ]]; then
            echo "Unable to read semantic version from pubspec.yaml" >&2
            exit 1
          fi

          if [[ "$tag_version" != "$pubspec_version" ]]; then
            echo "Release tag version ($tag_version) must match pubspec.yaml version ($pubspec_version)" >&2
            exit 1
          fi

  build-on-macos:
    name: macOS Apple Silicon + iOS
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos' }}
    needs: verify-release-version
    runs-on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          architecture: arm64
          cache: true

      - name: Disable Flutter Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          pod install --project-directory=macos
          pod install --project-directory=ios

      - name: Set release version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PACKAGE_VERSION="${GITHUB_REF_NAME##*-}"
            PACKAGE_VERSION="${PACKAGE_VERSION#v}"
          else
            PACKAGE_VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          if [[ "${GITHUB_REF_NAME}" == release-v* ]]; then
            UPDATE_CHANNEL="stable"
          else
            UPDATE_CHANNEL="preview"
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "UPDATE_CHANNEL=$UPDATE_CHANNEL" >> $GITHUB_ENV

      - name: Build signed macOS DMGs
        env:
          WHISPER_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          WHISPER_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          WHISPER_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          WHISPER_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          WHISPER_MACOS_REQUIRE_STABLE_SIGNING: "1"
        run: |
          WHISPER_UPDATE_CHANNEL="$UPDATE_CHANNEL" \
            WHISPER_MACOS_DMG_PATH="whisper-${PACKAGE_VERSION}-macos-arm64.dmg" \
            script/build_and_run.sh package-macos

      - name: Build iOS IPA
        run: |
          flutter build ios --no-codesign --no-pub --dart-define=WHISPER_UPDATE_CHANNEL=$UPDATE_CHANNEL
          dart script/prune_flutter_assets.dart ios build/ios/iphoneos/Runner.app/Frameworks/App.framework/flutter_assets
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r "whisper-${PACKAGE_VERSION}-ios-unsigned.ipa" Payload

      - name: Upload macOS and iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-macos-ios-${{ github.run_id }}
          path: |
            whisper-*-macos-arm64.dmg
            build/ios/iphoneos/whisper-*-ios-unsigned.ipa
          retention-days: 7

  build-on-macos-intel:
    name: macOS Intel
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos' || inputs.target == 'macos-intel' }}
    needs: verify-release-version
    # Build and link every x86_64 Flutter/native artifact on an actual Intel host.
    runs-on: macos-15-intel
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Flutter 3.47's Metal renderer corrupts frames on Intel UHD 630.
          # Keep Intel packages on the last engine verified on real x86 hardware.
          flutter-version: '3.41.7'
          channel: stable
          architecture: x64
          cache: true

      - name: Disable Flutter Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=macos

      - name: Set release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PACKAGE_VERSION="${GITHUB_REF_NAME##*-}"
            PACKAGE_VERSION="${PACKAGE_VERSION#v}"
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            PACKAGE_VERSION="$REQUESTED_VERSION"
          else
            PACKAGE_VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package version: $PACKAGE_VERSION" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" == release-v* ]]; then
            UPDATE_CHANNEL="stable"
          else
            UPDATE_CHANNEL="preview"
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "UPDATE_CHANNEL=$UPDATE_CHANNEL" >> $GITHUB_ENV

      - name: Build signed Intel macOS DMG
        env:
          WHISPER_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          WHISPER_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          WHISPER_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          WHISPER_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          WHISPER_MACOS_REQUIRE_STABLE_SIGNING: "1"
        run: |
          WHISPER_UPDATE_CHANNEL="$UPDATE_CHANNEL" \
            WHISPER_MACOS_DMG_PATH="whisper-${PACKAGE_VERSION}-macos-x86_64.dmg" \
            script/build_and_run.sh package-macos

      - name: Upload Intel macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-macos-intel-${{ github.run_id }}
          path: whisper-*-macos-x86_64.dmg
          retention-days: 7

  build-on-windows:
    name: Windows
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows' }}
    needs: verify-release-version
    runs-on: windows-2022
    env:
      # Cargokit's symlink resolver cannot traverse the hidden AppData folder.
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
          pub-cache-path: ${{ env.PUB_CACHE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Windows native build cache
        uses: actions/cache@v4
        with:
          path: |
            build/super_native_extensions
            build/irondash_engine_context
          key: windows-native-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}

      - name: Set release version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".Split('-')[-1].TrimStart('v')
          } else {
            $version = "0.0.${{ github.run_number }}"
          }
          $channel = if ("${{ github.ref_name }}".StartsWith("release-v")) { "stable" } else { "preview" }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UPDATE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify NSIS
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path -LiteralPath $makensis -PathType Leaf)) {
            throw "NSIS not found at $makensis"
          }

      - name: Build Windows app
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --no-pub --dart-define=WHISPER_UPDATE_CHANNEL=$env:UPDATE_CHANNEL
          if ($LASTEXITCODE -ne 0) {
            throw "flutter build windows failed with exit code $LASTEXITCODE"
          }
          $runner = @(Get-ChildItem -LiteralPath "build/windows" -Filter "whisper.exe" -File -Recurse)
          if ($runner.Count -ne 1) {
            $found = if ($runner.Count -eq 0) { "none" } else { ($runner.FullName -join ", ") }
            throw "Expected one built whisper.exe, found $($runner.Count): $found"
          }
          $releaseDir = $runner[0].Directory.FullName
          $assetsDir = Join-Path $releaseDir "data/flutter_assets"
          if (!(Test-Path -LiteralPath $assetsDir -PathType Container)) {
            throw "Flutter assets not found at $assetsDir"
          }
          "WINDOWS_RELEASE_DIR=$releaseDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          dart script/prune_flutter_assets.dart windows-x64 $assetsDir

      - name: Copy runtime DLLs
        run: |
          $releaseDir = (Resolve-Path -LiteralPath $env:WINDOWS_RELEASE_DIR -ErrorAction Stop).Path
          $systemDir = Join-Path $env:WINDIR "System32"
          @("vcruntime140_1.dll", "vcruntime140.dll", "msvcp140.dll") | ForEach-Object {
            $source = Join-Path $systemDir $_
            $destination = Join-Path $releaseDir $_
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Runtime DLL not found at $source"
            }
            Copy-Item -LiteralPath $source -Destination $destination -Force
          }

      - name: Create EXE installer
        run: |
          Push-Location windows
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" `
            /DAPP_NAME="Whisper" `
            /DAPP_VERSION="$env:APP_VERSION" `
            /DAPP_PUBLISHER="lawnvi" `
            /DOUTPUT_NAME="whisper-$($env:PACKAGE_VERSION)-windows-x86_64.exe" `
            /DBUILD_DIR="$env:WINDOWS_RELEASE_DIR" `
            installer.nsi
          Pop-Location

      - name: Verify installer exists
        run: |
          $path = "windows\whisper-$($env:PACKAGE_VERSION)-windows-x86_64.exe"
          if (!(Test-Path $path)) {
            throw "Installer not found at $path"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-windows-${{ github.run_id }}
          path: windows/whisper-*-windows-x86_64.exe
          retention-days: 7

  build-on-linux:
    name: Linux + Android
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux' || inputs.target == 'android' }}
    needs: verify-release-version
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android' }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          architecture: x64
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install system packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux' }}
        run: |
          sudo apt-get update -y
          # Jammy's GStreamer requires GNU libunwind-dev, while the runner's
          # preinstalled libc++ toolchain pins the incompatible LLVM 14 headers.
          sudo apt-get remove -y libunwind-14-dev
          sudo apt-get install -y ninja-build lld pkg-config libgtk-3-dev libpulse-dev libsecret-1-dev libkeybinder-3.0-dev libjsoncpp-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev alien
          sudo apt-get install -y avahi-daemon avahi-discover avahi-utils libnss-mdns mdns-scan libayatana-appindicator3-dev
          sudo apt-get install -y desktop-file-utils libfuse2

      - name: Set release version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PACKAGE_VERSION="${GITHUB_REF_NAME##*-}"
            PACKAGE_VERSION="${PACKAGE_VERSION#v}"
          else
            PACKAGE_VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          if [[ "${GITHUB_REF_NAME}" == release-v* ]]; then
            UPDATE_CHANNEL="stable"
          else
            UPDATE_CHANNEL="preview"
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "UPDATE_CHANNEL=$UPDATE_CHANNEL" >> $GITHUB_ENV

      - name: Build Linux app
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux' }}
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --no-pub --dart-define=WHISPER_UPDATE_CHANNEL=$UPDATE_CHANNEL

      - name: Build DEB package
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux' }}
        run: |
          chmod +x linux/build_deb.sh
          bash linux/build_deb.sh "$PACKAGE_VERSION" amd64
          deb_path="$(find build/linux/deb -name 'whisper-amd64.deb' -print -quit)"
          mv "$deb_path" "build/linux/deb/whisper-${PACKAGE_VERSION}-linux-amd64.deb"

      - name: Build RPM package
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux' }}
        run: |
          deb_path="$(find build/linux/deb -name 'whisper-*-linux-amd64.deb' -print -quit)"
          sudo alien -r "$deb_path"
          mv "whisper-${PACKAGE_VERSION}-2.x86_64.rpm" "whisper-${PACKAGE_VERSION}-linux-x86_64.rpm"

      - name: Install appimagetool
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux' }}
        run: |
          curl -L -o /tmp/appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          echo "APPIMAGE_TOOL=/tmp/appimagetool.AppImage" >> $GITHUB_ENV

      - name: Build AppImage
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux' }}
        run: |
          chmod +x linux/build_appimage.sh
          bash linux/build_appimage.sh "$PACKAGE_VERSION"
          mv "build/linux/appimage/whisper-${PACKAGE_VERSION}-x86_64.AppImage" "build/linux/appimage/whisper-${PACKAGE_VERSION}-linux-x86_64.AppImage"

      - name: Upload Linux artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-${{ github.run_id }}
          path: |
            whisper-*-linux-x86_64.rpm
            build/linux/deb/whisper-*-linux-amd64.deb
            build/linux/appimage/whisper-*-linux-x86_64.AppImage
          retention-days: 7

      - name: Ensure Android SDK packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android' }}
        run: |
          missing=()
          [[ -d "$ANDROID_SDK_ROOT/platforms/android-36" ]] || missing+=("platforms;android-36")
          [[ -d "$ANDROID_SDK_ROOT/build-tools/36.0.0" ]] || missing+=("build-tools;36.0.0")
          if (( ${#missing[@]} > 0 )); then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "${missing[@]}"
          fi

      - name: Prepare Android signing
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android' }}
        run: chmod +x android/append_local_properties.sh && sh android/append_local_properties.sh "${{ secrets.KEY_PASSWORD }}" "${{ secrets.STORE_PASSWORD }}"

      - name: Build Android release APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android' }}
        run: |
          flutter build apk --no-pub --dart-define=WHISPER_UPDATE_CHANNEL=$UPDATE_CHANNEL
          flutter build apk --split-per-abi --no-pub --dart-define=WHISPER_UPDATE_CHANNEL=$UPDATE_CHANNEL

      - name: Verify Android package size pruning
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android' }}
        run: |
          for apk in build/app/outputs/flutter-apk/app*-release.apk; do
            if unzip -Z1 "$apk" | grep -Eq 'opus_codec_(linux|web|windows)'; then
              echo "Foreign Opus assets remain in $apk" >&2
              exit 1
            fi
            du -h "$apk"
          done

      - name: Normalize Android APK names
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android' }}
        run: |
          apk_dir="build/app/outputs/flutter-apk"
          mv "$apk_dir/app-release.apk" "$apk_dir/whisper-${PACKAGE_VERSION}-android-universal.apk"
          mv "$apk_dir/app-arm64-v8a-release.apk" "$apk_dir/whisper-${PACKAGE_VERSION}-android-arm64-v8a.apk"
          mv "$apk_dir/app-armeabi-v7a-release.apk" "$apk_dir/whisper-${PACKAGE_VERSION}-android-armeabi-v7a.apk"
          mv "$apk_dir/app-x86_64-release.apk" "$apk_dir/whisper-${PACKAGE_VERSION}-android-x86_64.apk"

      - name: Upload Android artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android' }}
        uses: actions/upload-artifact@v4
        with:
          name: whisper-android-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/whisper-*-android-*.apk
          retention-days: 7

  publish-release:
    name: Publish release
    if: >-
      ${{
        always() &&
        (
          (
            startsWith(github.ref, 'refs/tags/') &&
            needs.build-on-macos.result == 'success' &&
            needs.build-on-macos-intel.result == 'success' &&
            needs.build-on-windows.result == 'success' &&
            needs.build-on-linux.result == 'success'
          ) ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.publish &&
            inputs.target == 'macos-intel' &&
            inputs.version != '' &&
            needs.build-on-macos-intel.result == 'success'
          )
        )
      }}
    needs:
      - build-on-macos
      - build-on-macos-intel
      - build-on-windows
      - build-on-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: whisper-*-${{ github.run_id }}
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('dev-v{0}', inputs.version) || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('dev-v{0}', inputs.version) || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'dev-v') }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
